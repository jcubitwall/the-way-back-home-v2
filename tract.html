<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Way Back Home · Tract</title>
<meta name="robots" content="noindex">
<link rel="icon" href="art/favicon-48.png" sizes="48x48">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="qr.js"></script>
<style>
/* A fold-out gospel tract, the same fold as Johnny's first tract: one tabloid sheet, 8 panels of
   4.25 × 5.5 in per side (plus 1/8 in bleed all round: 17.25 × 11.25 in), printed double-sided, flip on short edge.
     Side 1:  [back: QR | A-B-C | prayer | cover]
              [4 | 3 | 2 | 1]  (upside down)
     Side 2:  [5 | 6 | 7 | 8]
              [9 | 10 | 11 | 12]
   Fold in half along the long middle (5–12 inside), then zig-zag into four with the cover on top.
   Open: 1–4 side by side; "Unfold to keep reading" opens the middle fold to 5–12; "Turn over" shows the A-B-C and prayer.
   No cutting, no staples. Words come from "tract" in content/i18n/<code>.json (others fall back to English).
   tract.html?lang=xx */
:root{
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Verdana',system-ui,sans-serif;
  --blue:#2F7FD9; --ink:#1d1a24; --muted:#5a5566; --gold:#F4B740; --gold2:#C99A1E; --cream:#fffaf0;
  --green:#2f8a4e; --purple:#6b3fa0; --night:#26213f; --orange:#d9772a; --sky:#2f7fd9;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e7ef;color:var(--ink);font-family:var(--body)}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#fff;border-bottom:1px solid #d8d5e0}
.top div{flex:1 1 300px;font-size:14.5px;line-height:1.45;color:var(--muted)}
.top ol{margin:4px 0 0;padding-left:20px}
.top a{color:var(--blue);font-weight:700;text-decoration:none;font-size:15px}
.btn{font:800 17px var(--display);background:var(--gold);color:#2B2233;border:0;border-radius:999px;padding:11px 26px;cursor:pointer;box-shadow:0 3px 0 var(--gold2)}
.wrap{padding:20px 16px 40px;overflow:hidden}
.sheets{transform-origin:top left;width:17.25in;margin:0 auto}
.label{font:800 15px var(--display);color:var(--muted);margin:0 0 8px}
/* the sheet: 4 × 2 panels, the outer ones 1/8 in bigger for bleed */
.sheet{width:17.25in;height:11.25in;display:grid;grid-template-columns:4.375in 4.25in 4.25in 4.375in;grid-template-rows:5.625in 5.625in;
  background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18);margin-bottom:.35in;overflow:hidden}
.cell{position:relative;overflow:hidden;
  background-image:radial-gradient(rgba(255,255,255,.12) 1.1px,transparent 1.3px);background-size:.16in .16in}
.cell .pn{position:absolute;width:4.25in;height:5.5in}
.c0{padding-left:.125in}.c3{padding-right:.125in}
.c0 .pn{left:.125in}.c1 .pn,.c2 .pn{left:0}.c3 .pn{left:0}
.r0 .pn{top:.125in}.r1 .pn{top:0}
.flip .pn{transform:rotate(180deg)}
.green{background-color:var(--green)}.purple{background-color:var(--purple)}.night{background-color:var(--night)}
.orange{background-color:var(--orange)}.sky{background-color:var(--sky)}

/* story panel (17 Oct 2026, Johnny: "the modern bottom page blur"): like the book itself, the picture fills the panel,
   its bottom melts into a blurred, chapter-tinted copy of the same picture, and the words sit on the blur in white. */
.fr{position:absolute;inset:.12in;border-radius:.13in;overflow:hidden;background:#000;box-shadow:0 2pt 6pt rgba(0,0,0,.25)}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fr .soft{position:absolute;inset:0;
  -webkit-mask-image:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.65) 61%,#000 70%);mask-image:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.65) 61%,#000 70%)}
.fr .soft img{filter:blur(9px) saturate(1.15) brightness(.82);transform:scale(1.08)}
.fr .tint{position:absolute;inset:0;opacity:.62;
  -webkit-mask-image:linear-gradient(to bottom,transparent 58%,#000 82%);mask-image:linear-gradient(to bottom,transparent 58%,#000 82%)}
.green .tint{background:var(--green)}.purple .tint{background:var(--purple)}.night .tint{background:var(--night)}.orange .tint{background:var(--orange)}.sky .tint{background:var(--sky)}
.fr .txt{position:absolute;left:.22in;right:.22in;bottom:.2in;color:#fff;text-align:center;
  text-shadow:0 1px 2.5pt rgba(0,0,0,.55),0 0 10pt rgba(0,0,0,.3)}
.num{position:absolute;left:.12in;top:.12in;z-index:2;width:.38in;height:.38in;border-radius:50%;
  background:rgba(255,255,255,.92);color:var(--ink);font:900 12.5pt/.38in var(--display);text-align:center;box-shadow:0 1pt 4pt rgba(0,0,0,.3)}
.cap{margin:0;font:700 10.4pt/1.4 var(--body)}
.ref{margin:.07in 0 0;font:700 7.4pt/1.2 var(--body);opacity:.85;letter-spacing:.02em}
.hint{display:inline-block;margin:.09in 0 0;padding:.04in .14in;border-radius:999px;background:var(--gold);color:#2B2233;font:900 8.2pt/1.2 var(--display);text-shadow:none;box-shadow:0 1.5pt 0 var(--gold2)}

/* cover */
.cover{background:#7fb3e6}
.cover .art{position:absolute;inset:-.125in;background:url(art/src/cover.jpg) center 6%/cover no-repeat}
.cover .shade{position:absolute;left:-.125in;right:-.125in;bottom:-.125in;height:3in;background:linear-gradient(180deg,rgba(20,14,40,0),rgba(20,14,40,.55) 55%,rgba(20,14,40,.72))}
.cover .words{position:absolute;left:.3in;right:.3in;bottom:.5in;text-align:center;color:#fff}
.cover h1{margin:0;font:900 31pt/1 var(--display);text-shadow:0 2pt 8pt rgba(0,0,0,.45)}
.cover .tag{display:inline-block;margin:.12in 0 0;padding:.05in .16in;border-radius:999px;background:var(--gold);color:#2B2233;font:800 9pt var(--display);box-shadow:0 1.5pt 0 var(--gold2)}

/* text panels (back, A-B-C, prayer) */
.sheetcard{position:absolute;inset:.12in;background:rgba(255,250,240,.9);border-radius:.13in;padding:.3in .28in;display:flex;flex-direction:column;justify-content:center}
.blurbg{position:absolute;inset:-.2in;background-size:cover;background-position:center;filter:blur(14px) saturate(1.2) brightness(.85)}
.sheetcard h2{margin:0 0 .08in;font:900 15pt/1.15 var(--display);color:var(--orange)}
.sky .sheetcard h2{color:var(--sky)}
.sheetcard .intro{margin:0 0 .14in;font:400 9pt/1.35 var(--body);color:var(--muted)}
.step{display:flex;gap:.1in;align-items:flex-start;margin:0 0 .12in;font:400 9.6pt/1.35 var(--body)}
.step b.k{flex:none;width:.3in;height:.3in;border-radius:.07in;background:var(--orange);color:#fff;font:900 11pt/.3in var(--display);text-align:center}
.step b.w{font-weight:700}
.prayer{margin:0;padding:.16in .16in;background:#fdeccb;border-radius:.1in;font:400 10.4pt/1.45 var(--body)}
.small{margin:.14in 0 0;font:400 7.6pt/1.35 var(--body);color:var(--muted)}
.back{text-align:center;align-items:center}
.back .qr{width:1.7in;height:1.7in;margin:.08in 0 .1in}
.back .qr svg{display:block;width:100%;height:100%}
.back .u{font:700 10pt var(--body);color:var(--sky)}
.back p{margin:0}

.err{padding:24px;font-size:16px}
@page{size:17.25in 11.25in;margin:0}
@media print{
  html,body{background:#fff}
  .top,.label{display:none}
  .wrap{padding:0;overflow:visible}
  .sheets{transform:none!important;margin:0}
  .sheet{box-shadow:none;margin:0;break-after:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="top" id="top">
  <a id="back" href="./">‹ The Way Back Home</a>
  <div>A fold-out tract from one 11 × 17 sheet (with 1/8 in bleed for a print shop).
    <ol><li>Print double-sided, “flip on short edge”.</li>
    <li>Fold in half along the long middle, with pictures 5–12 inside.</li>
    <li>Zig-zag fold the strip into four, with the cover on top.</li></ol></div>
  <button class="btn" id="print" type="button">Print</button>
</div>
<div class="wrap" id="wrap"><div class="sheets" id="sheets"></div></div>
<script>
(async () => {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const get = p => fetch(p, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(p); return r.json(); });
  // the 12 story panels: picture, which part of it to keep in the frame (vertical %), panel colour
  // Picture rule (Johnny): never use cross-clip/cross-end where the message is "He took my place" (Chase turns away there).
  const ART = [['garden-end', 45, 'green'], ['rule-point', 40, 'green'], ['fruit-end', 32, 'purple'], ['exile-end', 45, 'purple'],
    ['test-2-end', 35, 'night'], ['locked-end', 42, 'night'], ['scrub-clip', 30, 'purple'], ['door-end', 35, 'orange'],
    ['cross-kneel', 100, 'orange'], ['choice-end', 95, 'orange'], ['tomb-end', 60, 'sky'], ['gates-arrive', 75, 'sky']];
  try {
    const langs = await get('content/languages.json');
    const sp = new URLSearchParams(location.search), q = sp.get('lang');
    let L = langs.langs[q] ? q : 'en';
    let T = await get(`content/i18n/${L}.json`);
    if (!T.tract) { L = 'en'; T = await get('content/i18n/en.json'); }
    const meta = langs.langs[L], h = document.documentElement; h.lang = L; h.dir = meta.dir || 'ltr';
    const tr = T.tract, cover = T.pages.cover, P = T.pages.prayer;
    document.title = `${cover.title} · Tract`;
    const back = document.getElementById('back'); back.href = `${L}/`; back.textContent = `‹ ${cover.title}`;

    const link = `https://thewaybackhome.net/${L}/`;
    const qr = qrcode(0, 'M'); qr.addData(link); qr.make();
    const n = qr.getModuleCount(), m = 1; let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x + m} ${y + m}h1v1h-1z`;
    const svg = `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#1d1a24"/></svg>`;

    // each panel: [colour class, inner html]
    const story = i => {
      const [img, y, col] = ART[i], [cap, ref] = tr.panels[i];
      const hint = i === 3 ? tr.unfold : i === 11 ? tr.turn : '';
      const pic = `<img src="art/src/${img}.jpg" alt="" style="object-position:50% ${y}%">`;
      return [col, `<div class="fr">${pic}<div class="soft">${pic}</div><div class="tint"></div>` +
        `<div class="txt"><p class="cap">${esc(cap)}</p><p class="ref">${esc(ref)}</p>${hint ? `<p class="hint">${esc(hint)}</p>` : ''}</div></div><div class="num">${i + 1}</div>`];
    };
    const coverP = ['cover', `<div class="art"></div><div class="shade"></div><div class="words"><h1>${esc(cover.title)}</h1><span class="tag">${esc(tr.tag)}</span></div>`];
    const backP = ['sky', `<div class="blurbg" style="background-image:url(art/src/gates-end.jpg)"></div><div class="sheetcard back"><h2>${esc(tr.home)}</h2><p class="intro">${esc(tr.free)}</p><div class="qr">${svg}</div>` +
      `<p class="u">${esc(link.replace(/^https:\/\//, '').replace(/\/$/, ''))}</p><p class="small">${esc(tr.talk)}</p><p class="small">${esc(tr.gift)}</p></div>`];
    const steps = P.steps.map(s => `<div class="step"><b class="k">${esc(s.key)}</b><span><b class="w">${esc(s.word)}</b> ${esc(s.rest)}</span></div>`).join('');
    const abcP = ['orange', `<div class="blurbg" style="background-image:url(art/src/choice-end.jpg)"></div><div class="sheetcard"><h2>${esc(P.title)}</h2><p class="intro">${esc(tr.easy)}</p>${steps}<p class="small">${esc(P.ref)}</p></div>`];
    const prayP = ['orange', `<div class="blurbg" style="background-image:url(art/src/clean.jpg)"></div><div class="sheetcard"><h2>${esc(tr.pray)}</h2><p class="prayer">${esc(P.prayer)}</p><p class="small">${esc(P.note)}</p></div>`];

    const side = (rows) => `<div class="sheet">${rows.map((row, r) => row.map((p, c) => {
      const [cls, html] = p[0], flip = p[1];
      return `<div class="cell ${cls} c${c} r${r}${flip ? ' flip' : ''}"><div class="pn">${html}</div></div>`;
    }).join('')).join('')}</div>`;
    const S = i => [story(i), false], U = i => [story(i), true];
    const side1 = side([[[backP, false], [abcP, false], [prayP, false], [coverP, false]], [U(3), U(2), U(1), U(0)]]);
    const side2 = side([[S(4), S(5), S(6), S(7)], [S(8), S(9), S(10), S(11)]]);
    const sheets = document.getElementById('sheets');
    sheets.innerHTML = `<p class="label">Side 1 (cover side)</p>${side1}<p class="label">Side 2 (inside)</p>${side2}`;
    const fit = () => {
      const avail = document.getElementById('wrap').clientWidth - 32, w = 17.25 * 96, k = Math.min(1, avail / w);
      sheets.style.transform = k < 1 ? `scale(${k})` : ''; sheets.style.marginLeft = k < 1 ? '0' : '';
      document.getElementById('wrap').style.height = k < 1 ? (sheets.offsetHeight * k + 60) + 'px' : '';
    };
    fit(); addEventListener('resize', fit);
    document.getElementById('print').onclick = () => window.print();
    // opened from Resources with ?print: print straight away once the pictures have loaded
    if (new URLSearchParams(location.search).has('print')) (document.readyState === 'complete' ? Promise.resolve() : new Promise(r => addEventListener('load', r))).then(() => setTimeout(() => window.print(), 500));
  } catch (e) {
    document.getElementById('wrap').innerHTML = '<p class="err">The tract could not load. Please check your connection and try again.</p>';
  }
})();
</script>
</body>
</html>
