<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Way Back Home · Going deeper</title>
<meta name="robots" content="noindex">
<link rel="icon" href="art/favicon-48.png" sizes="48x48">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="qr.js"></script>
<style>
/* Going deeper (ages 8–12): the same 7-week story as lessons.html, with harder questions. Each week has a teacher page and a take-home
   sheet; then extras (story order cards, door craft, certificate). Every page is 7.4 × 10 in, which fits inside
   Letter and A4 with the browser's default margins. lessons.html?week=3 shows one week; ?part=teacher|home.
   Memory verses: CSB. */
:root{
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Verdana',system-ui,sans-serif;
  --blue:#2F7FD9; --ink:#1d1a24; --muted:#5a5566; --gold:#F4B740; --gold2:#C99A1E; --cream:#fffaf0; --line:#d9d4e2;
  --green:#2f8a4e; --purple:#6b3fa0; --night:#3a3263; --red:#b8433a; --orange:#d9772a; --sky:#2f7fd9;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e7ef;color:var(--ink);font-family:var(--body)}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#fff;border-bottom:1px solid #d8d5e0}
.top a{color:var(--blue);font-weight:700;text-decoration:none;font-size:15px}
.top .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top select{font:600 15px var(--body);padding:7px 10px;border-radius:10px;border:1px solid #cfcadb;background:#fff;color:var(--ink)}
.btn{font:800 17px var(--display);background:var(--gold);color:#2B2233;border:0;border-radius:999px;padding:11px 26px;cursor:pointer;box-shadow:0 3px 0 var(--gold2)}
.wrap{padding:20px 16px 40px;overflow:hidden}
.pages{transform-origin:top left;width:7.4in;margin:0 auto}

/* one printed page; --c is the chapter colour, --t a light tint of it */
.page{position:relative;width:7.4in;height:10in;background:#fff;overflow:hidden;margin:0 0 .3in;box-shadow:0 6px 24px rgba(0,0,0,.16);
  font-size:10.8pt;line-height:1.38;--c:var(--blue);--t:#e8f1fc}
.page.green{--c:var(--green);--t:#e6f4ea}.page.purple{--c:var(--purple);--t:#f0e9f8}.page.night{--c:var(--night);--t:#ebe9f5}
.page.red{--c:var(--red);--t:#fbebe9}.page.orange{--c:var(--orange);--t:#fdf0e4}.page.sky{--c:var(--sky);--t:#e8f1fc}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;line-height:1.1}
p{margin:0}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12pt;font-size:7pt;color:#8a8496;border-top:1px solid var(--line);padding-top:4pt}

/* ---------- teacher page ---------- */
.page.tp{font-size:11.5pt;line-height:1.38}
.page.tp .need,.page.tp .tip p{font-size:10.4pt}
.page.tp .side .verse{font-size:12pt}
.t-head{display:flex;gap:.16in;align-items:stretch}
.t-head .tt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6pt}
.pill{display:inline-block;align-self:flex-start;background:var(--c);color:#fff;font:900 9.5pt var(--display);letter-spacing:.06em;
  text-transform:uppercase;padding:3pt 9pt;border-radius:99px}
.t-head h1{font-size:30pt;color:var(--c)}
.t-head .pg{font-size:9.5pt;color:var(--muted)}
.thumbs{display:flex;gap:5pt}
.thumbs img{width:1.3in;height:2.35in;object-fit:cover;border-radius:9pt;display:block}
.idea{margin:.14in 0 .06in;background:var(--t);border-radius:12pt;padding:8pt 12pt;font:900 14pt/1.25 var(--display);color:var(--c)}
.idea small{display:block;font:700 7.5pt var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2pt}
.two{display:grid;grid-template-columns:1fr 2.3in;gap:.18in}
.sec{margin-top:10pt}
.sec h3{font-size:13pt;color:var(--c);margin-bottom:2pt;display:flex;align-items:baseline;gap:6pt}
.sec h3 .min{font:700 8pt var(--body);color:var(--muted)}
.sec ol{margin:0;padding-left:15pt}
.sec li{margin:0 0 2.5pt}
.ans{color:var(--muted);font-style:italic}
.side .box{border:1.2pt solid var(--line);border-radius:10pt;padding:7pt 9pt;margin-top:8pt}
.side .box:first-child{margin-top:8pt;background:var(--t);border-color:var(--t)}
.side h3{font-size:10pt;color:var(--c);margin-bottom:3pt}
.verse{font:800 11pt/1.3 var(--display)}
.verse .ref{display:block;font:700 9pt var(--body);color:var(--muted);margin-top:3pt}
.need{font-size:9.4pt}
.need ul{margin:0;padding-left:13pt}
.tip{background:#fff7e3;border-color:#f0d9a3 !important}
.tip p{font-size:9.4pt}

/* ---------- take-home sheet ---------- */
.h-pic{position:relative;height:3.35in;border-radius:16pt;overflow:hidden}
.h-pic img{width:100%;height:100%;object-fit:cover;display:block}
.h-pic .lab{position:absolute;left:0;right:0;bottom:0;padding:30pt 16pt 11pt;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.h-pic h1{font-size:32pt;color:#fff;text-shadow:0 2pt 0 var(--c),0 3pt 8pt rgba(0,0,0,.45)}
.sticker{position:absolute;left:12pt;top:12pt;width:.78in;height:.78in;border-radius:50%;background:#fff;color:var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3pt var(--c),0 3pt 8pt rgba(0,0,0,.35);transform:rotate(-8deg)}
.sticker small{font:900 8pt/1 var(--display);letter-spacing:.08em}
.sticker b{font:900 26pt/1 var(--display)}
.bubble{position:relative;margin:.16in .1in .1in;background:var(--t);border-radius:16pt;padding:8pt 14pt;text-align:center;
  font:900 15.5pt/1.25 var(--display);color:var(--c)}
.bubble::before{content:'';position:absolute;left:50%;top:-9pt;margin-left:-9pt;border:9pt solid transparent;border-top:0;border-bottom-color:var(--t)}
.mv{display:flex;gap:10pt;align-items:center;background:var(--c);color:#fff;border-radius:14pt;padding:8pt 13pt}
.mv .star{flex:none;width:.5in;height:.5in}
.mv .tag{display:block;font:900 8pt var(--display);text-transform:uppercase;letter-spacing:.1em;opacity:.85;margin-bottom:1pt}
.mv .verse{font-size:11.5pt}
.mv .verse .ref{display:inline;color:#fff;opacity:.85;margin-left:4pt}
.act{margin-top:.14in}
.act h2{font-size:17pt;color:var(--c)}
.act .how{font-size:11.2pt;margin:2pt 0 8pt}
.home{position:absolute;left:0;right:0;bottom:.24in;display:flex;gap:12pt;align-items:center;border:1.2pt solid var(--line);border-radius:12pt;padding:7pt 11pt}
.home .qr{width:.78in;height:.78in;flex:none}
.home .qr svg{width:100%;height:100%;display:block}
.home b{font-family:var(--display);color:var(--c)}
.home p{font-size:9.2pt}
.home p+p{margin-top:3pt}

/* activities */
.trees{display:grid;grid-template-columns:repeat(9,1fr);gap:2pt 6pt}
.trees svg{width:100%;height:auto;display:block}
.draw{margin-top:8pt;border:1.6pt dashed var(--line);border-radius:12pt;position:relative}
.draw span{position:absolute;left:10pt;top:7pt;font:800 10pt var(--display);color:var(--muted)}
.tt-row{display:flex;align-items:center;gap:9pt;border-bottom:1pt solid var(--line);padding:5pt 0}
.tt-row .q{flex:1;font-size:12pt}
.chip{font:900 10pt var(--display);border:1.6pt solid var(--ink);border-radius:99px;padding:2.5pt 10pt;letter-spacing:.04em}
.ws{display:grid;grid-template-columns:3.05in 1fr;gap:.2in;align-items:start}
.grid{display:grid;border:1.6pt solid var(--ink);border-radius:8pt;overflow:hidden}
.grid div{display:flex;align-items:center;justify-content:center;font:800 12pt var(--display);aspect-ratio:1}
.words{columns:2;column-gap:10pt;font:800 10.5pt var(--display);margin:0;padding:0;list-style:none}
.words li{margin-bottom:3pt}
.words li::before{content:'☐ ';font-family:var(--body);font-weight:400}
.ten{font-size:9.8pt;padding-left:15pt;margin:2pt 0 0;columns:2;column-gap:16pt}
.ten li{break-inside:avoid;margin-bottom:2pt}
.wash .row{display:flex;align-items:center;gap:10pt;border-bottom:1pt solid var(--line);padding:4pt 0}
.wash .row span{flex:1;font-size:12pt}
.wash .yn{display:flex;gap:6pt;font:900 10pt var(--display)}
.wash .yn i{font-style:normal;border:1.6pt solid var(--ink);border-radius:6pt;padding:1.5pt 8pt}
.maze svg{display:block;margin:0 auto}
.code .key{display:flex;flex-wrap:wrap;gap:6pt 9pt;justify-content:center;margin-bottom:12pt}
.code .k{display:flex;align-items:center;gap:4pt;border:1.2pt solid var(--line);border-radius:8pt;padding:3pt 8pt 3pt 5pt;font:900 13pt var(--display)}
.code .msg{display:flex;flex-wrap:wrap;gap:6pt 5pt;justify-content:center}
.code .c{display:flex;flex-direction:column;align-items:center;gap:4pt;width:.44in}
.code .c svg{width:24px;height:24px}
.code .c .bl{width:.4in;border-bottom:1.8pt solid var(--ink);height:.34in}
.code .gap{width:.28in}
.abc .st{display:flex;gap:10pt;align-items:center;margin-bottom:6pt}
.abc .st b.k{flex:none;width:.42in;height:.42in;border-radius:50%;background:var(--c);color:#fff;font:900 16pt/.42in var(--display);text-align:center}
.abc .st span{font-size:12pt}
.abc .pr{margin-top:6pt;background:var(--t);border-radius:12pt;padding:8pt 12pt;font-size:10.8pt;font-style:italic}
.lines{margin-top:9pt;font:800 11pt var(--display)}
.lines .l{border-bottom:1.4pt solid var(--ink);height:.34in}

/* ---------- overview ---------- */
.ov h1{font-size:30pt;color:var(--blue)}
.ov .sub{font:800 13pt var(--display);color:var(--muted);margin-top:3pt}
.ov .lead{display:flex;gap:.2in;margin-top:.16in;align-items:center}
.ov .lead img{width:1.9in;height:2.6in;object-fit:cover;border-radius:12pt;flex:none}
.ov table{width:100%;border-collapse:collapse;margin-top:.14in;font-size:9.6pt}
.ov th{font:900 8.5pt var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:3pt 5pt;border-bottom:1.5pt solid var(--ink)}
.ov td{padding:5pt;border-bottom:1pt solid var(--line);vertical-align:middle}
.ov td.w{font:900 13pt var(--display);color:#fff;text-align:center;width:.34in}
.ov td b{font-family:var(--display)}
.ov .how{display:grid;grid-template-columns:1fr 1fr;gap:.16in;margin-top:.14in;font-size:9.6pt}
.ov .how h3{font-size:11pt;color:var(--blue);margin-bottom:3pt}
.ov .how ul{margin:0;padding-left:14pt}

/* ---------- extras ---------- */
.ex h1{font-size:22pt;color:var(--c)}
.ex .how{font-size:10pt;margin:3pt 0 8pt;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,4.15in);border-top:1pt dashed #999;border-left:1pt dashed #999}
.cards div{position:relative;border-right:1pt dashed #999;border-bottom:1pt dashed #999;padding:7pt}
.cards img{width:100%;height:100%;object-fit:cover;border-radius:9pt;display:block}
.cards b{position:absolute;left:12pt;top:12pt;background:#fff;color:var(--ink);font:900 13pt/1 var(--display);padding:4pt 8pt;border-radius:7pt}
.key-ans{margin-top:7pt;font-size:8.5pt;color:var(--muted)}
.craft{display:grid;grid-template-columns:1fr 1fr;gap:.22in;margin-bottom:.2in}
.craft .p{height:3.75in;border:1pt dashed #999;border-radius:4pt;position:relative;overflow:hidden}
.craft .p img{width:100%;height:100%;object-fit:cover;display:block}
.craft .p .cap{position:absolute;left:8pt;right:8pt;bottom:8pt;background:rgba(255,255,255,.92);border-radius:7pt;padding:5pt 7pt;text-align:center;font:800 10.5pt/1.25 var(--display)}
.craft .p .cap small{display:block;font:700 8pt var(--body);color:var(--muted)}
.craft .p.door svg{position:absolute;inset:0;width:100%;height:100%}
.craft .lab{font:900 8.5pt var(--display);color:var(--muted);margin-bottom:3pt;text-transform:uppercase;letter-spacing:.05em}
.cert{border:4pt double var(--gold2);border-radius:14pt;height:calc(100% - .25in);padding:.3in;text-align:center;display:flex;flex-direction:column;align-items:center}
.cert img{width:2.6in;height:2.9in;object-fit:cover;border-radius:14pt;margin:.12in 0}
.cert h1{font-size:28pt;color:var(--blue)}
.cert .name{width:4.6in;border-bottom:1.5pt solid var(--ink);height:.45in;margin:.06in auto 3pt}
.cert .vs{text-align:left;width:5.4in;margin-top:.1in;font-size:9.5pt}
.cert .vs div{display:flex;gap:7pt;border-bottom:1pt solid var(--line);padding:2.5pt 0}
.cert .vs div b{font-family:var(--display);min-width:1.1in}
.cert .sig{display:flex;gap:.4in;margin-top:auto;font-size:9pt;color:var(--muted)}
.cert .sig div{width:2.3in;border-top:1.2pt solid var(--ink);padding-top:3pt}

.idea .moves{display:block;font:700 9.6pt/1.35 var(--body);color:var(--ink);margin-top:3pt}
.map .road{position:absolute;inset:0;width:100%;height:100%}
.map .stop{position:absolute;border-radius:50%;overflow:hidden;box-shadow:0 0 0 4pt #fff,0 0 0 6pt var(--green),0 4pt 10pt rgba(0,0,0,.25)}
.map .stop img{width:100%;height:100%;object-fit:cover;display:block}
.map .stop .sn{position:absolute;left:50%;bottom:4pt;transform:translateX(-50%);background:#fff;color:var(--green);font:900 12pt/1 var(--display);padding:3pt 8pt;border-radius:99px}
.map .slab{position:absolute;width:2in;display:flex;align-items:center;justify-content:center;gap:4pt;font:900 11.5pt var(--display);text-align:center}
.map .slab span{background:#fff;border-radius:99px;padding:2pt 7pt;box-shadow:0 1pt 3pt rgba(0,0,0,.15)}
.map .flag{position:absolute;font:900 12pt var(--display);color:#fff;background:var(--green);padding:3pt 10pt;border-radius:99px;transform:rotate(-6deg)}
.map .mname{position:absolute;left:0;right:0;bottom:.3in;font:900 13pt var(--display)}
.map .mname span{display:inline-block;width:4.5in;border-bottom:1.5pt solid var(--ink);margin-left:6pt}
.snakes{display:flex;flex-direction:column;align-items:center;gap:.15in}
.snake{width:4.05in;height:4.05in;display:block}
.invs{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:4.35in 4.35in;border-top:1pt dashed #999;border-left:1pt dashed #999}
.inv{border-right:1pt dashed #999;border-bottom:1pt dashed #999;padding:8pt;display:flex;flex-direction:column}
.inv img{width:100%;height:1.75in;object-fit:cover;border-radius:10pt;display:block}
.inv .iw{padding:6pt 4pt 0;display:flex;flex-direction:column;flex:1}
.inv h2{font-size:19pt;color:var(--sky)}
.inv p{font-size:10pt;margin-top:3pt}
.inv .ib{display:flex;align-items:flex-end;gap:8pt;margin-top:auto}
.inv .qr{width:.95in;height:.95in;flex:none}.inv .qr svg{width:100%;height:100%;display:block}
.inv .from{flex:1;font:900 10pt var(--display);padding-bottom:4pt}.inv .from span{display:block;border-bottom:1.3pt solid var(--ink);height:.3in}

.page.dp.tp{font-size:10.3pt;line-height:1.34}
.dp .t-head h1{font-size:28pt}
.dp .thumbs img{width:1.12in;height:1.95in}
.dp .side .box{padding:6pt 8pt;margin-top:6pt}
.dp .side .box p,.dp .need{font-size:9.3pt;line-height:1.33}
.dp .side .verse{font-size:10.4pt}
.dp .sec{margin-top:7pt}.dp .sec h3{font-size:12pt}
.dp .sec ol{margin-top:2pt}
.ansbox{background:#f3f1f8;border-color:#f3f1f8 !important}
.kw{display:flex;align-items:center;gap:10pt;margin:.12in 0 .02in;background:#1d1a24;color:#fff;border-radius:12pt;padding:8pt 12pt}
.kword{flex:none;font:900 15pt var(--display);color:var(--gold);letter-spacing:.04em}
.kline{font:900 12.5pt/1.25 var(--display)}
.dk{font-size:10.6pt}
.d-pic{position:relative;height:2.55in;border-radius:14pt;overflow:hidden;background:#000}
.d-pic img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85) brightness(.92)}
.d-pic .file{position:absolute;left:12pt;top:11pt;font:700 9pt var(--body);letter-spacing:.22em;color:#fff;border:1.4pt solid rgba(255,255,255,.8);padding:3pt 8pt;border-radius:4pt;background:rgba(0,0,0,.35)}
.d-pic .lab{position:absolute;left:0;right:0;bottom:0;padding:34pt 14pt 10pt;background:linear-gradient(transparent,rgba(10,8,16,.88))}
.d-pic .kbig{display:inline-block;font:900 11pt var(--display);letter-spacing:.14em;color:#1d1a24;background:var(--gold);padding:2pt 9pt;border-radius:4pt}
.d-pic h1{font-size:30pt;color:#fff;margin-top:3pt}
.d-pic .lab p{color:#fff;font:800 12pt var(--display);opacity:.92;margin-top:2pt}
.mv2{margin-top:.1in;background:#1d1a24;color:#fff;border-radius:10pt;padding:7pt 12pt;font:800 10.4pt/1.32 var(--display)}
.mv2 .tag{display:block;font:700 7.8pt var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:2pt}
.dk .q{margin-top:.1in}
.dk .q h2{font-size:12.5pt;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.dk .q p{font-size:10.6pt;margin-top:1pt}
.dk .hq{font:900 13pt/1.25 var(--display) !important}
.dk .sm{color:var(--muted);font-size:9.4pt !important}
.ln{border-bottom:1.1pt solid #9b95a8;height:.3in}
.chal{margin-top:.12in;border:1.6pt solid var(--c);border-radius:10pt;padding:6pt 11pt;font-size:10.6pt}
.chal b{font-family:var(--display);color:var(--c)}
.w7wrap{margin-top:.1in;display:flex;align-items:center;gap:8pt}
.w7t{flex:none;font:900 8.5pt var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);width:.75in;line-height:1.15}
.w7{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4pt}
.w7 span{height:.42in;border:1.3pt dashed #b9b3c6;border-radius:7pt;display:flex;align-items:center;justify-content:center;gap:3pt;font:900 8pt var(--display);text-align:center;line-height:1.05;padding:0 2pt}
.w7 span b{font-size:7pt;color:var(--muted)}
.w7 span.on{border:1.3pt solid #1d1a24;background:#f3f1f8}
.w7 span.now{background:var(--gold);border-color:var(--gold2)}
.dk .home{bottom:.24in}
.ov.dp .lead img{filter:none}
.debts{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:2.7in;border-top:1pt dashed #999;border-left:1pt dashed #999}
.debt{border-right:1pt dashed #999;border-bottom:1pt dashed #999;padding:9pt 11pt;font-size:9.3pt;display:flex;flex-direction:column;gap:3pt;background:repeating-linear-gradient(#fff 0 17pt,#f6eeee 17pt 18pt)}
.debt .dh{display:flex;justify-content:space-between;font:900 9pt var(--display);letter-spacing:.08em;color:var(--red);border-bottom:1.5pt solid var(--red);padding-bottom:3pt}
.debt p span{display:inline-block;width:.62in;font-weight:700;color:var(--muted)}
.debt p i{display:inline-block;width:2in;border-bottom:1pt solid #1d1a24;height:10pt}
.debt .amt{font:900 13pt var(--display);color:var(--red)}
.debt .amt span{font:700 9.3pt var(--body)}
.debt .vs{font-style:italic;font-size:8.6pt;color:var(--muted)}
.debt .stamp{margin-top:auto;border:1.6pt dashed var(--red);border-radius:6pt;height:.42in;font:700 8.5pt var(--body);color:var(--muted);padding:3pt 6pt}
.evs{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1.68in;border-top:1pt dashed #999;border-left:1pt dashed #999}
.ev{border-right:1pt dashed #999;border-bottom:1pt dashed #999;padding:8pt 10pt}
.ev .evl{font:900 7.5pt var(--display);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--orange);padding:1.5pt 6pt;border-radius:3pt}
.ev.th .evl{background:#1d1a24}
.ev h3{font-size:12pt;margin:4pt 0 2pt}
.ev p{font-size:9.6pt;line-height:1.32}
.ev small{display:block;margin-top:3pt;font-size:8.3pt;color:var(--muted);font-weight:700}
.bms{display:grid;grid-template-columns:repeat(4,1fr);border-left:1pt dashed #999;border-top:1pt dashed #999;height:8.95in}
.bm{border-right:1pt dashed #999;border-bottom:1pt dashed #999;padding:8pt 7pt;display:flex;flex-direction:column;gap:4pt;background:linear-gradient(#1d1a24 0 .62in,#fff .62in)}
.bmt{color:var(--gold);font:900 12pt/1.1 var(--display);text-align:center;height:.5in;display:flex;align-items:center;justify-content:center}
.bw{display:flex;gap:5pt;align-items:flex-start}
.bw b{flex:none;width:.24in;height:.24in;border-radius:50%;background:#1d1a24;color:#fff;font:900 9pt/.24in var(--display);text-align:center}
.bw h3{font-size:10pt}
.bw p{font-size:8.2pt;line-height:1.25}

.run{list-style:none;margin:0;padding:0;position:relative}

(() => {

// the gospel in 7 words: one a week
const WORDS = [['MADE', 'God made me to know Him.', 'Genesis 1:27'], ['BROKEN', 'We didn’t trust Him, and sin broke everything.', 'Genesis 3'],

// Verses: CSB, checked word for word on bible.com (16 Oct 2026)
const W = [
 { n: 1, col: 'green', title: 'Made on purpose', pages: ['The garden', 'The one rule'], thumbs: [['garden-clip', 30], ['rule-end', 40]], pic: ['garden-end', 34],

   dig: [['Genesis 1:31', 'How did God describe what He made?', 'Very good. No death, no tears.'], ['Genesis 2:16–17', 'Count the yeses and the noes. Was God stingy?', 'Every tree but one.'], ['Genesis 3:8', 'What was the best part of Eden?', 'God walked with them.']],

  ['0:40', 'Live it', 'Real life', `Talk through the case on their sheet. Then answer the big question together (see right).`],
  ['0:50', 'Pray', 'Respond', `${esc(w.respond)} Add “${esc(WORDS[w.n - 1][0])}” to the seven words.`]];

const teacher = w => `<div class="page yt ${w.col}" data-w="${w.n}" data-p="teacher">
  <header class="yh"><div class="yhl"><p class="wk">Week ${w.n} of 7 <span>Teacher run-sheet, ages 8–12</span></p><h1 class="big">${esc(WORDS[w.n - 1][0])}</h1><p class="ln1">${esc(w.line)}</p></div>
    <div class="yth">${w.thumbs.map(([n, y]) => img(n, y)).join('')}</div></header>
  <div class="ycols"><ol class="run">${STEPS(w).map(([t, v, n, d]) => `<li><span class="t">${t}</span><div><h3>${esc(v)}: ${esc(n)}</h3><div class="d">${d}</div></div></li>`).join('')}<li class="end"><span class="t">0:55</span><div><h3>Done</h3></div></li></ol>
    <aside class="yside"><div class="yb vb"><h4>Memory verse</h4><p class="vt">${esc(w.verse[0])}</p><p class="vr">${esc(w.verse[1])} (CSB)</p></div>
      <div class="yb"><h4>Answering the big question</h4><p>${esc(w.hardA)}</p></div>
      <div class="yb care"><h4>Handle with care</h4><p>${esc(w.care)}</p></div>
      <div class="yb"><h4>You need</h4><p>${['A screen, Bibles, student sheets', ...w.hookNeed, ...w.act[1]].map(esc).join('<br>')}</p></div></aside></div>
  ${foot('The Way Back Home · Ages 8–12', CSB)}
</div>`;

const student = w => `<div class="page ys ${w.col}" data-w="${w.n}" data-p="home">
  <div class="sp">${img(w.pic[0], w.pic[1])}<span class="snum">${w.n}</span></div>
  <h1 class="big">${esc(WORDS[w.n - 1][0])}</h1><p class="ln1">${esc(w.line)}</p>
  <ol class="steps">
    <li><span class="sn">1</span><div><h2>Think</h2><p class="hq">${esc(w.hardQ)}</p>${lines(3)}</div></li>
    <li><span class="sn">2</span><div><h2>Read</h2><p>Look up <b>${esc(w.dig[1][0])}</b>. ${esc(w.dig[1][1])}</p>${lines(1)}</div></li>
    <li><span class="sn">3</span><div><h2>Live it</h2><p>${esc(w.real)}</p>${lines(2)}</div></li></ol>
  <div class="vband"><p>${esc(w.verse[0])}</p><b>${esc(w.verse[1])}</b></div>
  <div class="trk"><span class="tl">The gospel in 7 words</span>${WORDS.map(([wd], i) => `<span class="tw${i < w.n ? ' on' : ''}${i === w.n - 1 ? ' now' : ''}">${i < w.n ? esc(wd) : i + 1}</span>`).join('')}</div>
  <div class="yhome"><div class="qr">${qrSvg}</div><p><b>This week’s challenge:</b> ${esc(w.challenge)}<br><b>Grown-ups:</b> hear the book together at ${SITE}, then ask, “${esc(w.hardQ)}”</p></div>
  ${foot('The Way Back Home · Ages 8–12', CSB)}
</div>`;

const overview = () => `<div class="page yo" data-w="0" data-p="teacher">
  <div class="ohero">${img('gates-end', 30)}<div><p class="wk">7 weeks for ages 8–12</p><h1 class="big">The gospel in 7 words</h1><p class="ln1">One word a week. By the end, every student can tell the whole story in 60 seconds.</p></div></div>
  <ol class="owords">${W.map(w => `<li class="${w.col}"><span class="on">${w.n}</span><b>${esc(WORDS[w.n - 1][0])}</b><p>${esc(w.hardQ)}</p><small>${esc(w.verse[1])}</small></li>`).join('')}</ol>
  <div class="ohow"><div><h3>Every week, 55 minutes</h3><p>Hook, ask the big question, watch the book and read the Bible, an activity, real life, pray. The run-sheet has the clock times.</p></div>
    <div><h3>Telling hard truths</h3><p>Say what the Bible says, calmly: no added horror, no softening. Let them argue. Never use fear to push a decision.</p></div>
    <div><h3>What carries over</h3><p>The debt card (weeks 4 and 5), the marked plate (4 to 6), the seven words (every week).</p></div></div>
  ${foot('The Way Back Home · Ages 8–12', CSB)}
</div>`;

// ---------- extras ----------
const debtPage = () => {
  const card = `<div class="debt"><div class="dh"><span>STATEMENT OF ACCOUNT</span><b>No. 6:23</b></div>
    <p><span>Name:</span><i></i></p><p><span>Owed to:</span>God, the Judge of all the earth</p>
    <p><span>For:</span>every lie, every unkind word, every time I put myself first, every time I ignored God…</p>
    <p class="amt"><span>Amount:</span>EVERYTHING</p><p class="vs">“For the wages of sin is death…” Romans 6:23</p><div class="stamp">Status:</div></div>`;
  return `<div class="page ex red" data-w="x" data-p="teacher"><h1>Debt cards</h1><p class="how">For weeks 4 and 5. Cut out one per student. In week 4, collect them. Before week 5, write PAID IN FULL across each one in red.</p>
    <div class="debts">${card.repeat(6)}</div>${foot('The Way Back Home · Ages 8–12 · Extras', CSB)}</div>`;
};
const EV = [['The tomb was empty', 'Even Jesus’ enemies didn’t deny it. They made up a story that the body was stolen.', 'Matthew 28:11–15'],
  ['Guards and a sealed stone', 'Soldiers guarded the tomb, and the huge stone was sealed.', 'Matthew 27:62–66'],
  ['More than 500 witnesses', 'Over 500 people saw Him alive at one time, and most were still alive to ask when Paul wrote.', '1 Corinthians 15:6'],
  ['Women found it first', 'Back then, women weren’t trusted as witnesses in court. If you made the story up, you wouldn’t say women found it.', 'Luke 24:1–11'],
  ['Scared men became bold', 'The disciples hid in fear. Weeks later they preached in public, and faced prison and beatings rather than stop.', 'Acts 4:18–20; 5:40–42'],
  ['His brother changed', 'James, Jesus’ brother, didn’t believe in Him. Then Jesus appeared to him, and James became a leader of the church.', 'John 7:5; 1 Corinthians 15:7']];
const TH = [['Theory: the body was stolen', 'Past armed guards and a sealed stone? And would the disciples then suffer for a lie they knew they made up?'],
  ['Theory: the wrong tomb', 'Then the enemies just had to open the right tomb and show the body. They never did.'],
  ['Theory: He didn’t really die', 'Roman soldiers were experts at execution, and a spear was thrust into His side (John 19:34). A half-dead man couldn’t roll the stone and convince people he’d beaten death.'],
  ['Theory: they imagined it', 'Over 500 people don’t share one dream. He ate fish with them and they touched Him (Luke 24:39–43).']];
const evidencePage = () => `<div class="page ex orange" data-w="x" data-p="teacher"><h1>Evidence board</h1><p class="how">For week 6. One set per team. Cut on the dashed lines. Test each theory against the evidence.</p>
  <div class="evs">${EV.map(([t, d, r], i) => `<div class="ev"><span class="evl">Evidence ${i + 1}</span><h3>${esc(t)}</h3><p>${esc(d)}</p><small>${esc(r)}</small></div>`).join('')}
  ${TH.map(([t, d]) => `<div class="ev th"><span class="evl">Test it</span><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join('')}</div>${foot('The Way Back Home · Ages 8–12 · Extras', '')}</div>`;
const bookPage = () => {
  const strip = `<div class="bm"><p class="bmt">The gospel<br>in 7 words</p>${WORDS.map(([w, d, r], i) => `<div class="bw"><b>${i + 1}</b><div><h3>${esc(w)}</h3><p>${esc(d)}</p><small>${esc(r)}</small></div></div>`).join('')}
    <div class="bq"><div class="qr">${qrSvg}</div><p>Hear the whole story:<br><b>${SITE}</b></p></div></div>`;
  return `<div class="page ex sky" data-w="x" data-p="home"><h1>Gospel-in-7 bookmarks</h1><p class="how">For week 7. Cut on the dashed lines. One to keep, more to give away.</p>
    <div class="bms">${strip.repeat(4)}</div>${foot('The Way Back Home · Ages 8–12 · Extras', '')}</div>`;
};
const responsePage = () => {
  const card = `<div class="resp"><h3>Where am I?</h3><p class="sm">Only your teacher will read this.</p>
    <p>☐ I have already trusted Jesus.</p><p>☐ I want to follow Jesus, starting today.</p><p>☐ I’m not sure yet. I have questions:</p><div class="ln"></div><div class="ln"></div>
    <p>☐ Not right now.</p><p class="nm">Name:<span></span></p></div>`;
  return `<div class="page ex sky" data-w="x" data-p="teacher"><h1>Response cards</h1><p class="how">For week 7. Cut out one per student. Read them privately and follow up one-on-one.</p>
    <div class="resps">${card.repeat(4)}</div>${foot('The Way Back Home · Ages 8–12 · Extras', '')}</div>`;
};

const sp = new URLSearchParams(location.search);
const selW = document.getElementById('week'), selP = document.getElementById('part');
selW.value = sp.get('week') || ''; selP.value = sp.get('part') || '';
const root = document.getElementById('pages');
root.innerHTML = overview() + W.map(w => teacher(w) + student(w)).join('') + debtPage() + evidencePage() + bookPage() + responsePage();
const fit = () => { const wrap = document.getElementById('wrap'), k = Math.min(1, (wrap.clientWidth - 32) / (7.4 * 96));
  root.style.transform = k < 1 ? `scale(${k})` : ''; root.style.marginLeft = k < 1 ? '0' : ''; wrap.style.height = k < 1 ? (root.offsetHeight * k + 60) + 'px' : ''; };
const apply = () => { const wk = selW.value, pt = selP.value;
  root.querySelectorAll('.page').forEach(p => { p.style.display = (!wk || p.dataset.w === wk) && (!pt || p.dataset.p === pt) ? '' : 'none'; });
  const q = new URLSearchParams(); if (wk) q.set('week', wk); if (pt) q.set('part', pt);
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); fit(); };
selW.onchange = selP.onchange = apply; addEventListener('resize', fit);
document.getElementById('print').onclick = () => window.print();
apply(); if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
