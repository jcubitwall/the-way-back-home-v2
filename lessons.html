<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Way Back Home · Sunday school</title>
<meta name="robots" content="noindex">
<link rel="icon" href="art/favicon-48.png" sizes="48x48">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="qr.js"></script>
<style>
/* A 7-week Sunday school series built on the book (English). Each week has a teacher page and a take-home
   sheet; then extras (story order cards, door craft, certificate). Every page is 7.4 × 10 in, which fits inside
   Letter and A4 with the browser's default margins. lessons.html?week=3 shows one week; ?part=teacher|home.
   Memory verses: CSB. */
:root{
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Verdana',system-ui,sans-serif;
  --blue:#2F7FD9; --ink:#1d1a24; --muted:#5a5566; --gold:#F4B740; --gold2:#C99A1E; --cream:#fffaf0; --line:#d9d4e2;
  --green:#2f8a4e; --purple:#6b3fa0; --night:#3a3263; --red:#b8433a; --orange:#d9772a; --sky:#2f7fd9;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e7ef;color:var(--ink);font-family:var(--body)}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#fff;border-bottom:1px solid #d8d5e0}
.top a{color:var(--blue);font-weight:700;text-decoration:none;font-size:15px}
.top .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top select{font:600 15px var(--body);padding:7px 10px;border-radius:10px;border:1px solid #cfcadb;background:#fff;color:var(--ink)}
.btn{font:800 17px var(--display);background:var(--gold);color:#2B2233;border:0;border-radius:999px;padding:11px 26px;cursor:pointer;box-shadow:0 3px 0 var(--gold2)}
.wrap{padding:20px 16px 40px;overflow:hidden}
.pages{transform-origin:top left;width:7.4in;margin:0 auto}

/* one printed page; --c is the chapter colour, --t a light tint of it */
.page{position:relative;width:7.4in;height:10in;background:#fff;overflow:hidden;margin:0 0 .3in;box-shadow:0 6px 24px rgba(0,0,0,.16);
  font-size:10.8pt;line-height:1.38;--c:var(--blue);--t:#e8f1fc}
.page.green{--c:var(--green);--t:#e6f4ea}.page.purple{--c:var(--purple);--t:#f0e9f8}.page.night{--c:var(--night);--t:#ebe9f5}
.page.red{--c:var(--red);--t:#fbebe9}.page.orange{--c:var(--orange);--t:#fdf0e4}.page.sky{--c:var(--sky);--t:#e8f1fc}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;line-height:1.1}
p{margin:0}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12pt;font-size:7pt;color:#8a8496;border-top:1px solid var(--line);padding-top:4pt}

/* ---------- teacher page ---------- */
.page.tp{font-size:12pt;line-height:1.4}
.page.tp .need,.page.tp .tip p{font-size:10.4pt}
.page.tp .side .verse{font-size:12pt}
.t-head{display:flex;gap:.16in;align-items:stretch}
.t-head .tt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6pt}
.pill{display:inline-block;align-self:flex-start;background:var(--c);color:#fff;font:900 9.5pt var(--display);letter-spacing:.06em;
  text-transform:uppercase;padding:3pt 9pt;border-radius:99px}
.t-head h1{font-size:30pt;color:var(--c)}
.t-head .pg{font-size:9.5pt;color:var(--muted)}
.thumbs{display:flex;gap:5pt}
.thumbs img{width:1.3in;height:2.35in;object-fit:cover;border-radius:9pt;display:block}
.idea{margin:.14in 0 .06in;background:var(--t);border-radius:12pt;padding:8pt 12pt;font:900 14pt/1.25 var(--display);color:var(--c)}
.idea small{display:block;font:700 7.5pt var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2pt}
.two{display:grid;grid-template-columns:1fr 2.3in;gap:.18in}
.sec{margin-top:10pt}
.sec h3{font-size:13pt;color:var(--c);margin-bottom:2pt;display:flex;align-items:baseline;gap:6pt}
.sec h3 .min{font:700 8pt var(--body);color:var(--muted)}
.sec ol{margin:0;padding-left:15pt}
.sec li{margin:0 0 2.5pt}
.ans{color:var(--muted);font-style:italic}
.side .box{border:1.2pt solid var(--line);border-radius:10pt;padding:7pt 9pt;margin-top:8pt}
.side .box:first-child{margin-top:8pt;background:var(--t);border-color:var(--t)}
.side h3{font-size:10pt;color:var(--c);margin-bottom:3pt}
.verse{font:800 11pt/1.3 var(--display)}
.verse .ref{display:block;font:700 9pt var(--body);color:var(--muted);margin-top:3pt}
.need{font-size:9.4pt}
.need ul{margin:0;padding-left:13pt}
.tip{background:#fff7e3;border-color:#f0d9a3 !important}
.tip p{font-size:9.4pt}

/* ---------- take-home sheet ---------- */
.h-pic{position:relative;height:3.35in;border-radius:16pt;overflow:hidden}
.h-pic img{width:100%;height:100%;object-fit:cover;display:block}
.h-pic .lab{position:absolute;left:0;right:0;bottom:0;padding:30pt 16pt 11pt;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.h-pic h1{font-size:32pt;color:#fff;text-shadow:0 2pt 0 var(--c),0 3pt 8pt rgba(0,0,0,.45)}
.sticker{position:absolute;left:12pt;top:12pt;width:.78in;height:.78in;border-radius:50%;background:#fff;color:var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 3pt var(--c),0 3pt 8pt rgba(0,0,0,.35);transform:rotate(-8deg)}
.sticker small{font:900 8pt/1 var(--display);letter-spacing:.08em}
.sticker b{font:900 26pt/1 var(--display)}
.bubble{position:relative;margin:.16in .1in .1in;background:var(--t);border-radius:16pt;padding:8pt 14pt;text-align:center;
  font:900 15.5pt/1.25 var(--display);color:var(--c)}
.bubble::before{content:'';position:absolute;left:50%;top:-9pt;margin-left:-9pt;border:9pt solid transparent;border-top:0;border-bottom-color:var(--t)}
.mv{display:flex;gap:10pt;align-items:center;background:var(--c);color:#fff;border-radius:14pt;padding:8pt 13pt}
.mv .star{flex:none;width:.5in;height:.5in}
.mv .tag{display:block;font:900 8pt var(--display);text-transform:uppercase;letter-spacing:.1em;opacity:.85;margin-bottom:1pt}
.mv .verse{font-size:11.5pt}
.mv .verse .ref{display:inline;color:#fff;opacity:.85;margin-left:4pt}
.act{margin-top:.14in}
.act h2{font-size:17pt;color:var(--c)}
.act .how{font-size:11.2pt;margin:2pt 0 8pt}
.home{position:absolute;left:0;right:0;bottom:.24in;display:flex;gap:12pt;align-items:center;border:1.2pt solid var(--line);border-radius:12pt;padding:7pt 11pt}
.home .qr{width:.78in;height:.78in;flex:none}
.home .qr svg{width:100%;height:100%;display:block}
.home b{font-family:var(--display);color:var(--c)}
.home p{font-size:9.2pt}
.home p+p{margin-top:3pt}

/* activities */
.trees{display:grid;grid-template-columns:repeat(9,1fr);gap:2pt 6pt}
.trees svg{width:100%;height:auto;display:block}
.draw{margin-top:8pt;border:1.6pt dashed var(--line);border-radius:12pt;position:relative}
.draw span{position:absolute;left:10pt;top:7pt;font:800 10pt var(--display);color:var(--muted)}
.tt-row{display:flex;align-items:center;gap:9pt;border-bottom:1pt solid var(--line);padding:5pt 0}
.tt-row .q{flex:1;font-size:12pt}
.chip{font:900 10pt var(--display);border:1.6pt solid var(--ink);border-radius:99px;padding:2.5pt 10pt;letter-spacing:.04em}
.ws{display:grid;grid-template-columns:3.05in 1fr;gap:.2in;align-items:start}
.grid{display:grid;border:1.6pt solid var(--ink);border-radius:8pt;overflow:hidden}
.grid div{display:flex;align-items:center;justify-content:center;font:800 12pt var(--display);aspect-ratio:1}
.words{columns:2;column-gap:10pt;font:800 10.5pt var(--display);margin:0;padding:0;list-style:none}
.words li{margin-bottom:3pt}
.words li::before{content:'☐ ';font-family:var(--body);font-weight:400}
.ten{font-size:9.8pt;padding-left:15pt;margin:2pt 0 0;columns:2;column-gap:16pt}
.ten li{break-inside:avoid;margin-bottom:2pt}
.wash .row{display:flex;align-items:center;gap:10pt;border-bottom:1pt solid var(--line);padding:4pt 0}
.wash .row span{flex:1;font-size:12pt}
.wash .yn{display:flex;gap:6pt;font:900 10pt var(--display)}
.wash .yn i{font-style:normal;border:1.6pt solid var(--ink);border-radius:6pt;padding:1.5pt 8pt}
.maze svg{display:block;margin:0 auto}
.code .key{display:flex;flex-wrap:wrap;gap:6pt 9pt;justify-content:center;margin-bottom:12pt}
.code .k{display:flex;align-items:center;gap:4pt;border:1.2pt solid var(--line);border-radius:8pt;padding:3pt 8pt 3pt 5pt;font:900 13pt var(--display)}
.code .msg{display:flex;flex-wrap:wrap;gap:6pt 5pt;justify-content:center}
.code .c{display:flex;flex-direction:column;align-items:center;gap:4pt;width:.44in}
.code .c svg{width:24px;height:24px}
.code .c .bl{width:.4in;border-bottom:1.8pt solid var(--ink);height:.34in}
.code .gap{width:.28in}
.abc .st{display:flex;gap:10pt;align-items:center;margin-bottom:6pt}
.abc .st b.k{flex:none;width:.42in;height:.42in;border-radius:50%;background:var(--c);color:#fff;font:900 16pt/.42in var(--display);text-align:center}
.abc .st span{font-size:12pt}
.abc .pr{margin-top:6pt;background:var(--t);border-radius:12pt;padding:8pt 12pt;font-size:10.8pt;font-style:italic}
.lines{margin-top:9pt;font:800 11pt var(--display)}
.lines .l{border-bottom:1.4pt solid var(--ink);height:.34in}

/* ---------- overview ---------- */
.ov h1{font-size:30pt;color:var(--blue)}
.ov .sub{font:800 13pt var(--display);color:var(--muted);margin-top:3pt}
.ov .lead{display:flex;gap:.2in;margin-top:.16in;align-items:center}
.ov .lead img{width:1.9in;height:2.6in;object-fit:cover;border-radius:12pt;flex:none}
.ov table{width:100%;border-collapse:collapse;margin-top:.14in;font-size:9.6pt}
.ov th{font:900 8.5pt var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:3pt 5pt;border-bottom:1.5pt solid var(--ink)}
.ov td{padding:5pt;border-bottom:1pt solid var(--line);vertical-align:middle}
.ov td.w{font:900 13pt var(--display);color:#fff;text-align:center;width:.34in}
.ov td b{font-family:var(--display)}
.ov .how{display:grid;grid-template-columns:1fr 1fr;gap:.16in;margin-top:.14in;font-size:9.6pt}
.ov .how h3{font-size:11pt;color:var(--blue);margin-bottom:3pt}
.ov .how ul{margin:0;padding-left:14pt}

/* ---------- extras ---------- */
.ex h1{font-size:22pt;color:var(--c)}
.ex .how{font-size:10pt;margin:3pt 0 8pt;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,4.15in);border-top:1pt dashed #999;border-left:1pt dashed #999}
.cards div{position:relative;border-right:1pt dashed #999;border-bottom:1pt dashed #999;padding:7pt}
.cards img{width:100%;height:100%;object-fit:cover;border-radius:9pt;display:block}
.cards b{position:absolute;left:12pt;top:12pt;background:#fff;color:var(--ink);font:900 13pt/1 var(--display);padding:4pt 8pt;border-radius:7pt}
.key-ans{margin-top:7pt;font-size:8.5pt;color:var(--muted)}
.craft{display:grid;grid-template-columns:1fr 1fr;gap:.22in;margin-bottom:.2in}
.craft .p{height:3.75in;border:1pt dashed #999;border-radius:4pt;position:relative;overflow:hidden}
.craft .p img{width:100%;height:100%;object-fit:cover;display:block}
.craft .p .cap{position:absolute;left:8pt;right:8pt;bottom:8pt;background:rgba(255,255,255,.92);border-radius:7pt;padding:5pt 7pt;text-align:center;font:800 10.5pt/1.25 var(--display)}
.craft .p .cap small{display:block;font:700 8pt var(--body);color:var(--muted)}
.craft .p.door svg{position:absolute;inset:0;width:100%;height:100%}
.craft .lab{font:900 8.5pt var(--display);color:var(--muted);margin-bottom:3pt;text-transform:uppercase;letter-spacing:.05em}
.cert{border:4pt double var(--gold2);border-radius:14pt;height:calc(100% - .25in);padding:.3in;text-align:center;display:flex;flex-direction:column;align-items:center}
.cert img{width:2.6in;height:2.9in;object-fit:cover;border-radius:14pt;margin:.12in 0}
.cert h1{font-size:28pt;color:var(--blue)}
.cert .name{width:4.6in;border-bottom:1.5pt solid var(--ink);height:.45in;margin:.06in auto 3pt}
.cert .vs{text-align:left;width:5.4in;margin-top:.1in;font-size:9.5pt}
.cert .vs div{display:flex;gap:7pt;border-bottom:1pt solid var(--line);padding:2.5pt 0}
.cert .vs div b{font-family:var(--display);min-width:1.1in}
.cert .sig{display:flex;gap:.4in;margin-top:auto;font-size:9pt;color:var(--muted)}
.cert .sig div{width:2.3in;border-top:1.2pt solid var(--ink);padding-top:3pt}

@media print{
  @page{margin:.4in}
  html,body{background:#fff}
  .top{display:none}
  .wrap{padding:0;height:auto !important}
  .pages{transform:none !important;margin:0 auto}
  .page{box-shadow:none;margin:0 auto;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page:last-child{break-after:auto}
}
</style>
</head>
<body>
<div class="top">
  <a href="en/">‹ The Way Back Home</a>
  <div class="ctl">
    <select id="week" aria-label="Which pages">
      <option value="">All 7 weeks + extras</option>
      <option value="0">Series overview</option>
      <option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option>
      <option value="4">Week 4</option><option value="5">Week 5</option><option value="6">Week 6</option>
      <option value="7">Week 7</option><option value="x">Extras</option>
    </select>
    <select id="part" aria-label="Which sheets">
      <option value="">Teacher + take-home</option>
      <option value="teacher">Teacher pages only</option>
      <option value="home">Take-home sheets only</option>
    </select>
  </div>
  <button class="btn" id="print" type="button">Print</button>
</div>
<div class="wrap" id="wrap"><div class="pages" id="pages"></div></div>
<script>
(() => {
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const img = (n, y = 50, x = 50) => `<img src="art/src/${n}.jpg" alt="" style="object-position:${x}% ${y}%">`;
const SITE = 'thewaybackhome.net';
const LINK = `https://${SITE}/en/`;
const CSB = 'Scripture quotations are from the Christian Standard Bible®, © 2017 by Holman Bible Publishers. Used by permission.';

// a seeded random, so every print of the puzzles is the same
const rng = seed => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

const qrSvg = (() => {
  const qr = qrcode(0, 'M'); qr.addData(LINK); qr.make();
  const n = qr.getModuleCount(), m = 1; let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x + m} ${y + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#1d1a24"/></svg>`;
})();

// Memory verses: CSB (checked word for word, 16 Oct 2026)
const W = [
 { n: 1, col: 'green', title: 'God’s perfect home', pages: ['The garden', 'The one rule'],
   thumbs: [['garden', 50], ['rule', 40]], pic: ['garden', 38],
   bible: 'Genesis 1:1, 26–31; 2:8–9, 15–17',
   idea: 'God made a perfect world, and He loves to be with us!',
   verse: ['“God saw all that he had made, and it was very good indeed.”', 'Genesis 1:31'],
   welcome: 'What is your favourite place in the whole world?',
   talk: [
     ['What was the very best thing about Eden?', 'God was with them.'],
     ['How many rules did God give Adam and Eve?', 'Just one! Every other tree was a “yes”.'],
     ['Why would a loving Father give a rule?', 'Think of “Don’t touch the hot stove.”']],
   act: ['The one-rule game', ['Tape to mark a square on the floor'],
     'Play Simon Says, but everything is allowed except one thing: “Don’t step in the square.” Then ask: How many yeses were there? How many noes? God gave Adam and Eve a garden full of yeses.'],
   pray: 'Thank God for His good world, and for wanting to be close to us.',
   tip: 'Keep this week bright and happy. The sadness comes next week, and it means more once the children have enjoyed how good Eden was.',
   home: { kind: 'trees', ask: 'What was the one rule God gave Adam and Eve?' } },

 { n: 2, col: 'purple', title: 'The big lie', pages: ['The serpent', 'The fruit', 'Out of the garden'],
   thumbs: [['serpent', 40], ['fruit-end', 35], ['exile-end', 50]], pic: ['fruit-end', 28],
   bible: 'Genesis 3:1–24',
   idea: 'Sin means not trusting God. But God made a promise!',
   verse: ['“Every word of God is pure; he is a shield to those who take refuge in him.”', 'Proverbs 30:5'],
   welcome: 'Has anyone ever tricked you? How did it feel?',
   talk: [
     ['What did the serpent say? Was it true?', 'No. He twisted God’s words.'],
     ['What does the Bible call disobeying God?', 'Sin.'],
     ['How did God make clothes for Adam and Eve?', 'Animals had to die. Remember this, it comes back later!'],
     ['What did God promise?', 'Someone would come to open the way back home.']],
   act: ['Whisper chain', ['Nothing extra'],
     'Pass a whisper down the line: “You may eat from every tree, but not from that one.” See how it changes. Our words get mixed up by accident. The serpent changed God’s words on purpose. That’s why we check what God really said.'],
   pray: 'Ask God to help us trust what He says.',
   tip: 'Call the serpent what the Bible calls him: a liar. Sin is not just a mistake. It is choosing not to trust God.',
   home: { kind: 'truetrick', ask: 'What did God promise Adam and Eve?' } },

 { n: 3, col: 'night', title: 'Every one of us', pages: ['The long road', 'God’s law'],
   thumbs: [['wall', 50], ['law', 40], ['test-2-end', 40]], pic: ['test-2-end', 52],
   bible: 'Exodus 20:1–17; Romans 3:23; James 2:10',
   idea: 'Everybody sins. Me too.',
   verse: ['“For all have sinned and fall short of the glory of God.”', 'Romans 3:23'],
   welcome: 'Who is the oldest person in your family? (If we kept going back, we would reach Adam and Eve!)',
   talk: [
     ['What did every person on the road have?', 'Sin marks, like Adam and Eve.'],
     ['Have you ever told a lie? Taken something that wasn’t yours?', 'Answer quietly, in your heart.'],
     ['“And that’s only two of the ten!” Why does breaking one rule matter?', 'James 2:10.']],
   act: ['Ten on my fingers', ['Nothing extra'],
     'Learn God’s ten rules (on the take-home sheet), one finger each, with a simple action for each one. Say them twice, faster the second time. Then ask: is there a finger you could hold up and say, “I have always kept this one”?'],
   pray: 'Tell God quietly that we have broken His good rules.',
   tip: 'Never ask children to confess sins out loud. Say “I have broken these too.” Then it isn’t a lecture.',
   home: { kind: 'wordsearch', ask: 'Which two of God’s rules did the book ask about?' } },

 { n: 4, col: 'red', title: 'Locked out', pages: ['Locked out', 'Can we scrub it off?'],
   thumbs: [['locked', 45], ['locked-2-end', 50], ['scrub', 30]], pic: ['scrub', 14],
   bible: 'Romans 3:20; Isaiah 59:2; Romans 6:23; Ephesians 2:8–9',
   idea: 'Sin locks us out, and we can’t scrub it off.',
   verse: ['“For you are saved by grace through faith, and this is not from yourselves; it is God’s gift.”', 'Ephesians 2:8'],
   welcome: 'Have you ever been locked out of your house?',
   talk: [
     ['What does a mirror do? What can’t it do?', 'It shows the dirt but can’t wash it off. God’s law is the same.'],
     ['What did the children try, to scrub their marks off?', 'Being good, saying sorry, going to church. It didn’t work.'],
     ['Someone has to take our place. Who could it be?', 'Leave it as a question until next week!']],
   act: ['The mark that won’t come off', ['A white plastic plate (keep it for week 6!)', 'A permanent marker', 'Water, soap, a sponge'],
     'Draw a small “sin mark” on the plate with the permanent marker. Let the children try to scrub it off with water, then soap. It stays. Put the plate away: “Next week we find out who can make us clean.”'],
   pray: 'Tell God we can’t clean ourselves, and thank Him the story isn’t over.',
   tip: 'The book names hell plainly. Say it calmly, as the book does, then point ahead: “That is very bad news, but it is not the end of the story.”',
   home: { kind: 'wash', ask: 'Why couldn’t the children scrub their marks off?' } },

 { n: 5, col: 'orange', title: 'The door', pages: ['The door', 'The cross'],
   thumbs: [['door', 50], ['cross', 50]], pic: ['cross', 42],
   bible: 'John 10:9; John 3:16; John 14:6; Isaiah 53:6',
   idea: 'Jesus is the door! He died in our place.',
   verse: ['“For God loved the world in this way: He gave his one and only Son, so that everyone who believes in him will not perish but have eternal life.”', 'John 3:16'],
   welcome: 'If you were locked out, what would you need to get back in?',
   talk: [
     ['Who is the Someone God promised in the garden?', 'Jesus, God’s own Son.'],
     ['Jesus said, “I am the door.” What does a door do?', 'It lets you in. Jesus is the only way to God.'],
     ['Jesus never sinned. Why does that matter?', 'Only someone with no sin could take our place.'],
     ['Why did Jesus do it?', 'Because He loves us.']],
   act: ['Door craft', ['Door craft sheets (extras)', 'Scissors, glue sticks, crayons'],
     'Colour the door, cut it on its dashed line, and fold it open. Glue the cross picture behind it, so opening the door shows the cross. Say together: “Jesus is the door!”'],
   pray: 'Thank Jesus for dying in our place.',
   tip: 'This is the turning point of the series. After four weeks of bad news, slow down and let the good news land.',

const wordSearch = () => {
  const words = ['ADAM', 'EVE', 'EDEN', 'GARDEN', 'TREE', 'SERPENT', 'FRUIT', 'SIN', 'PROMISE', 'LAW', 'COMMANDMENTS', 'PEOPLE'];
  const N = 12, R = rng(7), g = Array.from({ length: N }, () => Array(N).fill(''));
  const dirs = [[0, 1], [1, 0], [1, 1]];
  for (const w of [...words].sort((a, b) => b.length - a.length)) {
    for (let tries = 0; tries < 2000; tries++) {
      const [dy, dx] = dirs[Math.floor(R() * dirs.length)];
      const y = Math.floor(R() * (N - dy * (w.length - 1))), x = Math.floor(R() * (N - dx * (w.length - 1)));
      let ok = true; for (let k = 0; k < w.length; k++) { const c = g[y + dy * k][x + dx * k]; if (c && c !== w[k]) { ok = false; break; } }
      if (!ok) continue;
      for (let k = 0; k < w.length; k++) g[y + dy * k][x + dx * k] = w[k];
      break;
    }
  }
  const AB = 'ABCDEFGHIJKLMNOPRSTUVWY';
  const cells = g.flat().map(c => `<div>${c || AB[Math.floor(R() * AB.length)]}</div>`).join('');
  return `<div class="act"><h2>Word search</h2><p class="how">Find the words. They go across, down, or slanting down.</p>` +
    `<div class="ws"><div class="grid" style="grid-template-columns:repeat(${N},1fr)">${cells}</div><div><ul class="words">${words.map(w => `<li>${w}</li>`).join('')}</ul>` +
    `<p style="font:900 11pt var(--display);color:var(--c);margin-top:8pt">God’s ten good rules</p><ol class="ten">` +
    ['Love God most of all.', 'Don’t worship idols.', 'Use God’s name with respect.', 'Keep God’s day holy.', 'Honour your mom and dad.',
      'Don’t murder.', 'Keep marriage pure.', 'Don’t steal.', 'Don’t lie.', 'Don’t want what is not yours.'].map(t => `<li>${t}</li>`).join('') +
    `</ol></div></div></div>`;
};
const homeWash = () => {
  const T = ['Soap and water', 'Being extra good', 'Saying sorry', 'Going to church', 'Trying harder tomorrow'];
  return `<div class="act wash"><h2>Can it wash sin away?</h2><p class="how">The kids tried to scrub their sin marks off. Can these take sin away? Circle YES or NO.</p>` +

const homeMaze = () => {
  const C = 13, Rw = 8, R = rng(2026), s = 34;
  const seen = Array.from({ length: Rw }, () => Array(C).fill(false));
  const walls = { h: Array.from({ length: Rw + 1 }, () => Array(C).fill(true)), v: Array.from({ length: Rw }, () => Array(C + 1).fill(true)) };
  const st = [[0, 0]]; seen[0][0] = true;
  while (st.length) {
    const [y, x] = st[st.length - 1];
    const nb = [[y - 1, x], [y + 1, x], [y, x - 1], [y, x + 1]].filter(([a, b]) => a >= 0 && a < Rw && b >= 0 && b < C && !seen[a][b]);
    if (!nb.length) { st.pop(); continue; }
    const [a, b] = nb[Math.floor(R() * nb.length)];
    if (a !== y) walls.h[Math.max(a, y)][x] = false; else walls.v[y][Math.max(b, x)] = false;
    seen[a][b] = true; st.push([a, b]);
  }
  walls.v[0][0] = false; walls.v[Rw - 1][C] = false;
  const ox = 46, oy = 8, w = C * s + ox + 70, h = Rw * s + oy * 2;
  let d = '';
  for (let y = 0; y <= Rw; y++) for (let x = 0; x < C; x++) if (walls.h[y][x]) d += `M${ox + x * s} ${oy + y * s}h${s}`;
  for (let y = 0; y < Rw; y++) for (let x = 0; x <= C; x++) if (walls.v[y][x]) d += `M${ox + x * s} ${oy + y * s}v${s}`;
  const ex = ox + C * s, ey = oy + (Rw - 1) * s;
  const door = `<g transform="translate(${ex + 10} ${ey - 26})"><path d="M0 60V22a22 22 0 0 1 44 0v38z" fill="#fff" stroke="#1d1a24" stroke-width="2.4"/>` +
    `<path d="M22 8v40M12 22h20" stroke="#1d1a24" stroke-width="3"/><circle cx="36" cy="40" r="2.6" fill="#1d1a24"/></g>`;
  const kid = `<g transform="translate(6 ${oy + 4})"><circle cx="16" cy="8" r="7" fill="#fff" stroke="#1d1a24" stroke-width="2"/><path d="M5 30c0-9 22-9 22 0" fill="#fff" stroke="#1d1a24" stroke-width="2"/><text x="16" y="44" font-family="Grandstander" font-weight="900" font-size="11" text-anchor="middle">YOU</text></g>`;
  return `<div class="act maze"><h2>Find the door!</h2><p class="how">Jesus said, “I am the door.” Find your way to Him!</p>` +
    `<svg viewBox="0 0 ${w} ${h}" width="${(w / 96).toFixed(2)}in" style="max-width:100%"><path d="${d}" stroke="#1d1a24" stroke-width="2.6" stroke-linecap="round" fill="none"/>${door}${kid}</svg></div>`;
};

  });
  const q = new URLSearchParams(); if (wk) q.set('week', wk); if (pt) q.set('part', pt);
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  fit();
};
selW.onchange = selP.onchange = apply;
addEventListener('resize', fit);
document.getElementById('print').onclick = () => window.print();
apply();
if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
</body>
