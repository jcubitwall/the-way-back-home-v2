<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Way Back Home · Sunday school</title>
<meta name="robots" content="noindex">
<link rel="icon" href="art/favicon-48.png" sizes="48x48">
<link rel="stylesheet" href="fonts/fonts.css">
<script src="qr.js"></script>
<style>
/* A 7-week Sunday school series built on the book (English). Each week has a teacher page and a take-home
   sheet; then extras (story order cards, door craft, certificate). Every page is 7.4 × 10 in, which fits inside
   Letter and A4 with the browser's default margins. lessons.html?week=3 shows one week; ?part=teacher|home|extras. */
:root{
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;
  --body:'Andika','Verdana',system-ui,sans-serif;
  --blue:#2F7FD9; --ink:#1d1a24; --muted:#5a5566; --gold:#F4B740; --gold2:#C99A1E; --cream:#fffaf0; --line:#d9d4e2;
  --green:#2f8a4e; --purple:#6b3fa0; --night:#3a3263; --red:#b8433a; --orange:#d9772a; --sky:#2f7fd9;
}
*{box-sizing:border-box}
html,body{margin:0;background:#e9e7ef;color:var(--ink);font-family:var(--body)}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#fff;border-bottom:1px solid #d8d5e0}
.top a{color:var(--blue);font-weight:700;text-decoration:none;font-size:15px}
.top .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.top select{font:600 15px var(--body);padding:7px 10px;border-radius:10px;border:1px solid #cfcadb;background:#fff;color:var(--ink)}
.btn{font:800 17px var(--display);background:var(--gold);color:#2B2233;border:0;border-radius:999px;padding:11px 26px;cursor:pointer;box-shadow:0 3px 0 var(--gold2)}
.wrap{padding:20px 16px 40px;overflow:hidden}
.pages{transform-origin:top left;width:7.4in;margin:0 auto}

/* one printed page */
.page{position:relative;width:7.4in;height:10in;background:#fff;overflow:hidden;margin:0 0 .3in;box-shadow:0 6px 24px rgba(0,0,0,.16);
  font-size:10.8pt;line-height:1.38;--c:var(--blue)}
.page.green{--c:var(--green)}.page.purple{--c:var(--purple)}.page.night{--c:var(--night)}.page.red{--c:var(--red)}
.page.orange{--c:var(--orange)}.page.sky{--c:var(--sky)}
h1,h2,h3{font-family:var(--display);font-weight:900;margin:0;line-height:1.1}
p{margin:0}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;font-size:7.5pt;color:#8a8496;border-top:1px solid var(--line);padding-top:4pt}

/* teacher page */
.t-head{display:flex;gap:.18in;align-items:stretch;height:1.62in}
.t-head .tt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:5pt}
.pill{display:inline-block;align-self:flex-start;background:var(--c);color:#fff;font:900 9.5pt var(--display);letter-spacing:.06em;
  text-transform:uppercase;padding:3pt 9pt;border-radius:99px}
.t-head h1{font-size:25pt;color:var(--c)}
.t-head .pg{font-size:9.5pt;color:var(--muted)}
.thumbs{display:flex;gap:5pt}
.thumbs img{width:.92in;height:1.62in;object-fit:cover;border-radius:7pt;display:block}
.idea{margin:.14in 0 .1in;background:var(--cream);border-left:5pt solid var(--c);border-radius:0 8pt 8pt 0;padding:7pt 11pt;
  font:800 12.5pt/1.3 var(--display)}
.idea small{display:block;font:700 7.5pt var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2pt}
.two{display:grid;grid-template-columns:1fr 2.35in;gap:.18in}
.sec{margin-top:8pt}
.sec h3{font-size:11pt;color:var(--c);margin-bottom:3pt;display:flex;align-items:baseline;gap:6pt}
.sec h3 .min{font:700 8pt var(--body);color:var(--muted)}
.sec ol,.sec ul{margin:0;padding-left:15pt}
.sec li{margin:0 0 2.5pt}
.ans{color:var(--muted);font-style:italic}
.side .box{border:1.2pt solid var(--line);border-radius:9pt;padding:7pt 9pt;margin-top:8pt}
.side .box:first-child{margin-top:0}
.side h3{font-size:10pt;color:var(--c);margin-bottom:3pt}
.verse{font:800 11pt/1.3 var(--display)}
.verse .ref{display:block;font:700 9pt var(--body);color:var(--muted);margin-top:3pt}
.need{font-size:9.2pt}
.need ul{margin:0;padding-left:13pt}
.tip{background:#fff7e3;border-color:#f0d9a3 !important}
.tip p{font-size:9.2pt}

/* take-home sheet */
.h-pic{position:relative;height:2.75in;border-radius:12pt;overflow:hidden}
.h-pic img{width:100%;height:100%;object-fit:cover;display:block}
.h-pic .lab{position:absolute;left:0;right:0;bottom:0;padding:22pt 14pt 10pt;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff}
.h-pic .lab .pill{background:#fff;color:var(--c)}
.h-pic h1{font-size:24pt;margin-top:4pt;text-shadow:0 1pt 3pt rgba(0,0,0,.4)}
.h-idea{text-align:center;font:800 12.5pt/1.3 var(--display);color:var(--c);margin:.12in .2in .08in}
.mv{display:flex;gap:10pt;align-items:center;border:1.5pt dashed var(--c);border-radius:10pt;padding:6pt 11pt}
.mv .tag{flex:none;font:900 8.5pt/1.1 var(--display);color:var(--c);text-transform:uppercase;letter-spacing:.05em;width:.7in}
.mv .verse{font-size:10.5pt}
.act{margin-top:.12in}
.act h2{font-size:14pt;color:var(--c)}
.act .how{font-size:10pt;color:var(--ink);margin:2pt 0 7pt}
.home{position:absolute;left:0;right:0;bottom:.24in;display:flex;gap:12pt;align-items:center;background:var(--cream);border-radius:10pt;padding:8pt 11pt}
.home .qr{width:.82in;height:.82in;flex:none}
.home .qr svg{width:100%;height:100%;display:block}
.home b{font-family:var(--display);color:var(--c)}
.home p{font-size:9.4pt}
.home p+p{margin-top:3pt}

/* activities */
.trees{display:grid;grid-template-columns:repeat(9,1fr);gap:2pt 6pt}
.trees svg{width:100%;height:auto;display:block}
.draw{margin-top:8pt;border:1.4pt solid var(--line);border-radius:10pt;height:1.35in;position:relative}
.draw span{position:absolute;left:9pt;top:6pt;font-size:9pt;color:var(--muted)}
.tt-list{display:grid;gap:5pt}
.tt-row{display:flex;align-items:center;gap:9pt;border-bottom:1pt solid var(--line);padding:3.5pt 0}
.tt-row .q{flex:1;font-size:10.6pt}
.chip{font:900 9.5pt var(--display);border:1.5pt solid var(--ink);border-radius:99px;padding:2.5pt 9pt;letter-spacing:.04em}
.ws{display:grid;grid-template-columns:3.55in 1fr;gap:.2in;align-items:start}
.grid{display:grid;border:1.5pt solid var(--ink);border-radius:6pt;overflow:hidden}
.grid div{display:flex;align-items:center;justify-content:center;font:800 13pt var(--display);aspect-ratio:1}
.words{columns:2;column-gap:10pt;font:800 10pt var(--display);margin:0;padding:0;list-style:none}
.words li{margin-bottom:3pt}
.words li::before{content:'☐ ';font-family:var(--body);font-weight:400}
.ten{margin-top:8pt;font-size:9.2pt;columns:2;column-gap:12pt;padding-left:14pt;margin-bottom:0}
.wash{display:grid;gap:5pt}
.wash .row{display:flex;align-items:center;gap:10pt;border-bottom:1pt solid var(--line);padding:3pt 0}
.wash .row span{flex:1;font-size:10.6pt}
.wash .yn{display:flex;gap:6pt;font:900 9pt var(--display)}
.wash .yn i{font-style:normal;border:1.4pt solid var(--ink);border-radius:5pt;padding:1.5pt 7pt}
.who{margin-top:8pt;display:flex;gap:12pt;align-items:center;border:1.4pt solid var(--line);border-radius:10pt;padding:8pt 12pt}
.who .big{font:900 40pt/1 var(--display);color:var(--c)}
.maze svg{display:block;margin:0 auto}
.code .key{display:flex;flex-wrap:wrap;gap:5pt 9pt;justify-content:center;margin-bottom:10pt}
.code .k{display:flex;align-items:center;gap:4pt;border:1.2pt solid var(--line);border-radius:7pt;padding:2pt 7pt 2pt 4pt;font:900 12pt var(--display)}
.code .msg{display:flex;flex-wrap:wrap;gap:6pt 4pt;justify-content:center}
.code .c{display:flex;flex-direction:column;align-items:center;gap:3pt;width:.4in}
.code .c .bl{width:.36in;border-bottom:1.5pt solid var(--ink);height:.3in}
.code .gap{width:.25in}
.abc .st{display:flex;gap:9pt;align-items:flex-start;margin-bottom:5pt}
.abc .st b.k{flex:none;width:.34in;height:.34in;border-radius:50%;background:var(--c);color:#fff;font:900 13pt/.34in var(--display);text-align:center}
.abc .st span{font-size:10.4pt;padding-top:3pt}
.abc .pr{margin-top:6pt;background:#f4f1fa;border-radius:9pt;padding:7pt 11pt;font-size:10pt;font-style:italic}
.lines{margin-top:9pt;font-size:10.5pt}
.lines .l{border-bottom:1.2pt solid var(--ink);height:.32in;margin-bottom:2pt}

/* overview */
.ov h1{font-size:30pt;color:var(--blue)}
.ov .sub{font:800 13pt var(--display);color:var(--muted);margin-top:3pt}
.ov .lead{display:flex;gap:.2in;margin-top:.16in;align-items:center}
.ov .lead img{width:1.6in;height:2.1in;object-fit:cover;border-radius:10pt}
.ov table{width:100%;border-collapse:collapse;margin-top:.14in;font-size:9.4pt}
.ov th{font:900 8.5pt var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:3pt 5pt;border-bottom:1.5pt solid var(--ink)}
.ov td{padding:5pt;border-bottom:1pt solid var(--line);vertical-align:top}
.ov td.w{font:900 13pt var(--display);color:#fff;text-align:center;width:.34in;border-radius:6pt}
.ov td b{font-family:var(--display)}
.ov .how{display:grid;grid-template-columns:1fr 1fr;gap:.16in;margin-top:.12in;font-size:9.4pt}
.ov .how h3{font-size:11pt;color:var(--blue);margin-bottom:3pt}
.ov .how ul{margin:0;padding-left:14pt}

/* extras */
.ex h1{font-size:20pt;color:var(--c)}
.ex .how{font-size:9.6pt;margin:3pt 0 8pt;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,2.72in);border-top:1pt dashed #999;border-left:1pt dashed #999}
.cards div{position:relative;border-right:1pt dashed #999;border-bottom:1pt dashed #999;padding:6pt}
.cards img{width:100%;height:100%;object-fit:cover;border-radius:6pt;display:block}
.cards b{position:absolute;left:10pt;top:10pt;background:#fff;color:var(--ink);font:900 10pt/1 var(--display);padding:3pt 6pt;border-radius:5pt}
.key-ans{margin-top:7pt;font-size:8pt;color:var(--muted)}
.craft{display:grid;grid-template-columns:1fr 1fr;gap:.22in;margin-bottom:.2in}
.craft .p{height:3.75in;border:1pt dashed #999;border-radius:4pt;position:relative;overflow:hidden}
.craft .p img{width:100%;height:100%;object-fit:cover;display:block}
.craft .p .cap{position:absolute;left:8pt;right:8pt;bottom:8pt;background:rgba(255,255,255,.92);border-radius:7pt;padding:5pt 7pt;text-align:center;font:800 10pt/1.25 var(--display)}
.craft .p .cap small{display:block;font:700 8pt var(--body);color:var(--muted)}
.craft .p.door svg{position:absolute;inset:0;width:100%;height:100%}
.craft .lab{font:900 8.5pt var(--display);color:var(--muted);margin-bottom:3pt;text-transform:uppercase;letter-spacing:.05em}
.cert{border:4pt double var(--gold2);border-radius:14pt;height:100%;padding:.3in;text-align:center;display:flex;flex-direction:column;align-items:center}
.cert img{width:2.3in;height:2.5in;object-fit:cover;border-radius:12pt;margin:.12in 0}
.cert h1{font-size:26pt;color:var(--blue)}
.cert .name{width:4.6in;border-bottom:1.5pt solid var(--ink);height:.5in;margin:.1in auto 3pt}
.cert .vs{text-align:left;width:5.6in;margin-top:.1in;font-size:9.3pt}
.cert .vs div{display:flex;gap:7pt;border-bottom:1pt solid var(--line);padding:2.5pt 0}
.cert .vs div b{font-family:var(--display);min-width:1.1in}
.cert .sig{display:flex;gap:.4in;margin-top:auto;font-size:9pt;color:var(--muted)}
.cert .sig div{width:2.3in;border-top:1.2pt solid var(--ink);padding-top:3pt}

@media print{
  @page{margin:.4in}
  html,body{background:#fff}
  .top{display:none}
  .wrap{padding:0;height:auto !important}
  .pages{transform:none !important;margin:0 auto}
  .page{box-shadow:none;margin:0 auto;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page:last-child{break-after:auto}
}
</style>
</head>
<body>
<div class="top">
  <a href="en/">‹ The Way Back Home</a>
  <div class="ctl">
    <select id="week" aria-label="Which pages">
      <option value="">All 7 weeks + extras</option>
      <option value="0">Series overview</option>
      <option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option>
      <option value="4">Week 4</option><option value="5">Week 5</option><option value="6">Week 6</option>
      <option value="7">Week 7</option><option value="x">Extras</option>
    </select>
    <select id="part" aria-label="Which sheets">
      <option value="">Teacher + take-home</option>
      <option value="teacher">Teacher pages only</option>
      <option value="home">Take-home sheets only</option>
    </select>
  </div>
  <button class="btn" id="print" type="button">Print</button>
</div>
<div class="wrap" id="wrap"><div class="pages" id="pages"></div></div>
<script>
(() => {
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const img = (n, y = 50, x = 50) => `<img src="art/src/${n}.jpg" alt="" style="object-position:${x}% ${y}%">`;
const SITE = 'thewaybackhome.net';
const LINK = `https://${SITE}/en/`;

// a seeded random, so every print of the puzzles is the same
const rng = seed => () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

// QR code for the take-home sheets
const qrSvg = (() => {
  const qr = qrcode(0, 'M'); qr.addData(LINK); qr.make();
  const n = qr.getModuleCount(), m = 1; let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) d += `M${x + m} ${y + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#1d1a24"/></svg>`;
})();

const W = [
 { n: 1, col: 'green', title: 'God’s perfect home', pages: ['The garden', 'The one rule'],
   thumbs: [['garden', 50], ['rule', 40]], pic: ['garden', 38],
   bible: 'Genesis 1:1, 26–31; 2:8–9, 15–17',
   idea: 'God made everything good, and He made us to live close to Him and trust Him.',
   verse: ['“And God saw everything that he had made, and behold, it was very good.”', 'Genesis 1:31'],
   welcome: 'What is your favourite place in the whole world? What makes a place feel like home?',
   talk: [
     ['What did God make? What was the very best thing about Eden?', 'God was with them, and they loved being with Him.'],
     ['How many rules did God give Adam and Eve?', 'Just one. Every other tree was a “yes”.'],
     ['The book says the rule came “from a Father who loved them”. How can a rule be a loving thing?', 'Think of “Don’t touch the hot stove.”'],
     ['Adam pointed at the tree so Eve would remember. How can we help each other remember what God says?', '']],
   act: ['The one-rule game', ['Masking tape (mark one square on the floor)'],
     'Play like Simon Says, but every action is allowed except one: “Don’t step in the square.” Call out lots of fun actions, sometimes near the square. Afterwards ask: How many yeses were there? How many noes? Was the one rule hard to keep? Point out that God gave Adam and Eve a garden full of yeses.'],
   pray: 'Thank God for the good world He made, and for wanting to be close to us.',
   tip: 'Keep this week bright. Everything was perfect, so let the children enjoy it. The sadness comes next week, and it lands harder when they have felt how good Eden was.',
   home: { kind: 'trees', ask: 'What was the one rule God gave Adam and Eve? Why do you think He gave it?' } },

 { n: 2, col: 'purple', title: 'The big lie', pages: ['The serpent', 'The fruit', 'Sent out of the garden'],
   thumbs: [['serpent', 40], ['fruit-end', 35], ['exile-end', 50]], pic: ['fruit-end', 28],
   bible: 'Genesis 3:1–24',
   idea: 'Sin is not trusting and obeying God. It broke our friendship with Him, but God made a promise.',
   verse: ['“Every word of God proves true; he is a shield to those who take refuge in him.”', 'Proverbs 30:5'],
   welcome: 'Has anyone ever tricked you? How did you feel when you found out?',
   talk: [
     ['What did the serpent say? Was it true?', 'He twisted God’s words and called God a liar.'],
     ['What did Eve and Adam do? What does the Bible call disobeying God?', 'Sin.'],
     ['How did things change after they sinned?', 'They felt afraid and ashamed, and they had to leave the garden.'],
     ['How did God make clothes for them? What did it cost?', 'Animals had to die. Remember this, it comes back later!'],
     ['What did God promise?', 'Someone would come to crush the serpent and open the way back home. Who might it be?']],
   act: ['Whisper chain', ['Nothing extra'],
     'Sit in a line or circle. Whisper “God said: you may eat from every tree, but not from that one tree” to the first child, and pass it along. Compare the last version with the first. Then say: our words get mixed up by accident, but the serpent changed God’s words on purpose. That’s why we check what God really said in the Bible.'],
   pray: 'Ask God to help us trust what He says, even when something else looks good.',
   tip: 'The book shows the serpent grinning. Name him as the Bible does: a liar. Children should leave knowing that sin is not just “a mistake”. It is choosing not to trust God.',
   home: { kind: 'truetrick', ask: 'What did God promise Adam and Eve, even after they sinned?' } },

 { n: 3, col: 'night', title: 'Every one of us', pages: ['The long road', 'The Ten Commandments'],
   thumbs: [['wall', 50], ['law', 40], ['test-2-end', 40]], pic: ['test-2-end', 52],
   bible: 'Exodus 20:1–17; Romans 3:23; James 2:10',
   idea: 'Not only Adam and Eve. Everyone has sinned, and that includes me.',
   verse: ['“For all have sinned and fall short of the glory of God.”', 'Romans 3:23'],
   welcome: 'Who is the oldest person in your family? Who were their parents? (If we kept going back, we would reach Adam and Eve!)',
   talk: [
     ['What did every person on the long road have?', 'Sin marks, just like Adam and Eve.'],
     ['Read the short Ten Commandments together (on the take-home sheet). Which ones are easy to break when nobody is watching?', ''],
     ['Have you ever told a lie? Taken something that wasn’t yours?', 'Answer silently, in your heart. Nobody has to say it out loud.'],
     ['The book says, “And that’s only two of the ten!” Why does breaking even one matter?', 'James 2:10.']],
   act: ['Ten on my fingers', ['Nothing extra'],
     'Teach the ten commandments with one finger each and a simple action: one finger up for “one God”, hands together for “honour your parents”, hand over mouth for “don’t lie”, and so on. Go through them twice, faster the second time. Then ask: which finger could you hold up and say “I’ve always kept this one”?'],
   pray: 'Tell God honestly, quietly, that we have broken His good rules.',
   tip: 'Don’t ask children to confess sins aloud. Let the questions work quietly, as the book does. Join in yourself: “I have broken these too.” That keeps it from sounding like a lecture.',
   home: { kind: 'wordsearch', ask: 'The book asked two questions about the Ten Commandments. Do you remember them?' } },

 { n: 4, col: 'red', title: 'Locked out', pages: ['Locked out', 'Can we scrub it off?'],
   thumbs: [['locked', 45], ['locked-2-end', 50], ['scrub', 40]], pic: ['scrub', 14],
   bible: 'Romans 3:20; Isaiah 59:2; Romans 6:23; Isaiah 64:6; Ephesians 2:8–9',
   idea: 'Sin locks us out of God’s home, and we can’t wash it away by ourselves.',
   verse: ['“For by grace you have been saved through faith. And this is not your own doing; it is the gift of God.”', 'Ephesians 2:8'],
   welcome: 'Have you ever been locked out of your house? What did you do?',
   talk: [
     ['What does a mirror do? What can’t it do?', 'It shows the dirt but can’t wash it off. God’s law is like that.'],
     ['Why can’t God just pretend our sin never happened?', 'He is good and fair, like a fair judge.'],
     ['What did the children try, to scrub their marks off? Did it work?', 'Being extra good, saying sorry, going to church. The marks stayed.'],
     ['Remember the animals in the garden? Someone has to take our place. Who could it be?', 'Leave it as a question until next week.']],
   act: ['The mark that won’t come off', ['A white plastic plate (keep it for week 6!)', 'A permanent marker', 'Water, soap, a sponge, paper towels'],
     'Draw a small mark on the plate with the permanent marker: a “sin mark”. Let the children try to scrub it off with water, then soap, then the sponge. It stays. Ask: Would being extra good tomorrow clean it? Put the plate away and say: “Next week we find out who can make us clean.”'],
   pray: 'Tell God we can’t clean ourselves, and thank Him that the story isn’t finished.',
   tip: 'The book names hell plainly. Say it calmly and truthfully, the way the book does, without adding scary detail, then point forward: “That is very bad news, but it is not the end of the story.”',
   home: { kind: 'wash', ask: 'Why couldn’t the children in the book scrub their marks off?' } },

 { n: 5, col: 'orange', title: 'The door', pages: ['The door', 'The cross'],
   thumbs: [['door', 50], ['cross', 50]], pic: ['cross', 42],
   bible: 'John 10:9; John 3:16; John 14:6; Isaiah 53:6; 1 Peter 2:24',
   idea: 'Jesus is the way back home. He took the punishment for our sin on the cross.',
   verse: ['“For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life.”', 'John 3:16'],
   welcome: 'If you were locked out, what would you need to get back in?',
   talk: [
     ['Who is the Someone God promised back in the garden?', 'Jesus, God’s own Son.'],
     ['Jesus said, “I am the door.” What does a door do?', 'It lets you in. Jesus is the only way back to God (John 14:6).'],
     ['Did Jesus ever sin? Why does that matter?', 'Only someone with no sin of His own could take our place.'],
     ['How is the cross like the animals in the garden?', 'Someone innocent died in our place.'],

const wordSearch = () => {
  const words = ['ADAM', 'EVE', 'EDEN', 'GARDEN', 'TREE', 'SERPENT', 'FRUIT', 'SIN', 'PROMISE', 'LAW', 'COMMANDMENTS', 'PEOPLE'];
  const N = 12, R = rng(7), g = Array.from({ length: N }, () => Array(N).fill(''));
  const dirs = [[0, 1], [1, 0], [1, 1]];
  const order = [...words].sort((a, b) => b.length - a.length);
  for (const w of order) {
    for (let tries = 0; tries < 2000; tries++) {
      const [dy, dx] = dirs[Math.floor(R() * dirs.length)];
      const y = Math.floor(R() * (N - dy * (w.length - 1))), x = Math.floor(R() * (N - dx * (w.length - 1)));
      let ok = true; for (let k = 0; k < w.length; k++) { const c = g[y + dy * k][x + dx * k]; if (c && c !== w[k]) { ok = false; break; } }
      if (!ok) continue;
      for (let k = 0; k < w.length; k++) g[y + dy * k][x + dx * k] = w[k];
      break;
    }
  }
  const AB = 'ABCDEFGHIJKLMNOPRSTUVWY';
  const cells = g.flat().map(c => `<div>${c || AB[Math.floor(R() * AB.length)]}</div>`).join('');
  return `<div class="act"><h2>Word search</h2><p class="how">Find the words from weeks 1 to 3. They go across, down, or slanting down.</p>` +
    `<div class="ws"><div class="grid" style="grid-template-columns:repeat(${N},1fr)">${cells}</div><div><ul class="words">${words.map(w => `<li>${w}</li>`).join('')}</ul>` +
    `<p style="font:900 10.5pt var(--display);color:var(--c);margin-top:9pt">God’s ten good rules</p><ol class="ten" style="columns:1;padding-left:14pt;margin-top:2pt">` +
    ['Love God more than anything.', 'Don’t make idols to worship.', 'Use God’s name with respect.', 'Keep God’s day holy.', 'Honour your father and mother.',
      'Don’t murder.', 'Be faithful in marriage.', 'Don’t steal.', 'Don’t lie.', 'Don’t want what belongs to others.'].map(t => `<li>${t}</li>`).join('') +
    `</ol></div></div></div>`;
};
const homeWash = () => {
  const T = ['Soap and water', 'Being extra good', 'Saying sorry', 'Going to church', 'Trying really hard tomorrow'];
  return `<div class="act"><h2>Can it wash sin away?</h2><p class="how">The children in the book tried to scrub their sin marks off. Can these take sin away? Circle YES or NO.</p>` +
    `<div class="wash">${T.map(t => `<div class="row"><span>${t}</span><span class="yn"><i>YES</i><i>NO</i></span></div>`).join('')}</div>` +
    `<div class="who"><span class="big">?</span><p style="font-size:10.6pt"><b style="font-family:var(--display)">Someone has to take our place.</b> Remember the animals that died to cover Adam and Eve? Who could take our place? Write or draw your guess, then find out next week!</p></div>` +
    `<div class="draw" style="height:1.05in"><span>My guess:</span></div></div>`;
};
const homeMaze = () => {
  const C = 13, Rw = 10, R = rng(2026), s = 34;
  const seen = Array.from({ length: Rw }, () => Array(C).fill(false));
  const walls = { h: Array.from({ length: Rw + 1 }, () => Array(C).fill(true)), v: Array.from({ length: Rw }, () => Array(C + 1).fill(true)) };
  const st = [[0, 0]]; seen[0][0] = true;
  while (st.length) {
    const [y, x] = st[st.length - 1];
    const nb = [[y - 1, x], [y + 1, x], [y, x - 1], [y, x + 1]].filter(([a, b]) => a >= 0 && a < Rw && b >= 0 && b < C && !seen[a][b]);
    if (!nb.length) { st.pop(); continue; }
    const [a, b] = nb[Math.floor(R() * nb.length)];
    if (a !== y) walls.h[Math.max(a, y)][x] = false; else walls.v[y][Math.max(b, x)] = false;
    seen[a][b] = true; st.push([a, b]);
  }
  walls.v[0][0] = false; walls.v[Rw - 1][C] = false;           // entrance left top, exit right bottom
  const ox = 46, oy = 8, w = C * s + ox + 70, h = Rw * s + oy * 2;
  let d = '';
  for (let y = 0; y <= Rw; y++) for (let x = 0; x < C; x++) if (walls.h[y][x]) d += `M${ox + x * s} ${oy + y * s}h${s}`;
  for (let y = 0; y < Rw; y++) for (let x = 0; x <= C; x++) if (walls.v[y][x]) d += `M${ox + x * s} ${oy + y * s}v${s}`;
  const ex = ox + C * s, ey = oy + (Rw - 1) * s;
  const door = `<g transform="translate(${ex + 10} ${ey - 26})"><path d="M0 60V22a22 22 0 0 1 44 0v38z" fill="#fff" stroke="#1d1a24" stroke-width="2.4"/>` +
    `<path d="M22 8v40M12 22h20" stroke="#1d1a24" stroke-width="3"/><circle cx="36" cy="40" r="2.6" fill="#1d1a24"/></g>`;
  const kid = `<g transform="translate(6 ${oy + 4})"><circle cx="16" cy="8" r="7" fill="#fff" stroke="#1d1a24" stroke-width="2"/><path d="M5 30c0-9 22-9 22 0" fill="#fff" stroke="#1d1a24" stroke-width="2"/><text x="16" y="44" font-family="Grandstander" font-weight="900" font-size="11" text-anchor="middle">YOU</text></g>`;
  return `<div class="act maze"><h2>Find the way to the door</h2><p class="how">Jesus said, “I am the door. Whoever comes in through Me will be saved” (John 10:9). Help the child find the way to the door.</p>` +
    `<svg viewBox="0 0 ${w} ${h}" width="${(w / 96 * 1.0).toFixed(2)}in" style="max-width:100%"><path d="${d}" stroke="#1d1a24" stroke-width="2.6" stroke-linecap="round" fill="none"/>${door}${kid}</svg></div>`;
};

  <p style="font-size:10.5pt">This certificate is given to</p><div class="name"></div>
  <p style="font-size:9.5pt;color:var(--muted)">for learning the whole story, from the garden to the new earth.</p>
  <div class="vs"><p style="font:900 10pt var(--display);color:var(--blue);margin-bottom:3pt">Memory verses I can say</p>
    ${W.map(w => `<div><b>Week ${w.n}</b><span>${esc(w.verse[1])}</span><span style="margin-left:auto">☐</span></div>`).join('')}</div>
  <div class="sig"><div>Teacher</div><div>Date</div></div></div>${foot('The Way Back Home · Extras', ESV)}</div>`;

// ---------- render ----------
const sp = new URLSearchParams(location.search);
const selW = document.getElementById('week'), selP = document.getElementById('part');
selW.value = sp.get('week') || ''; selP.value = sp.get('part') || '';
const root = document.getElementById('pages');
root.innerHTML = overview() + W.map(w => teacher(w) + takehome(w)).join('') + cardsPage() + craftPage() + certPage();
const apply = () => {
  const wk = selW.value, pt = selP.value;
  root.querySelectorAll('.page').forEach(p => {
    const okW = !wk || p.dataset.w === wk, okP = !pt || p.dataset.p === pt || (pt === 'teacher' && p.dataset.w === 'x');
    p.style.display = okW && okP ? '' : 'none';
  });
  const q = new URLSearchParams(); if (wk) q.set('week', wk); if (pt) q.set('part', pt);
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
  fit();
};
const fit = () => {
  const wrap = document.getElementById('wrap'), avail = wrap.clientWidth - 32, k = Math.min(1, avail / (7.4 * 96));
  root.style.transform = k < 1 ? `scale(${k})` : ''; root.style.marginLeft = k < 1 ? '0' : '';
  wrap.style.height = k < 1 ? (root.offsetHeight * k + 60) + 'px' : '';
};
selW.onchange = selP.onchange = apply;
addEventListener('resize', fit);
document.getElementById('print').onclick = () => window.print();
apply();
if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
