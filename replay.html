<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Replay</title>
<link rel="icon" href="art/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="art/apple-touch-icon.png">
<meta name="theme-color" content="#0d0b12">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--sky:#2F7FD9;--gold:#FFD166;--display:'Grandstander','Trebuchet MS',system-ui,sans-serif;--body:'Andika','Verdana',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#0d0b12;color:#fff;font-family:var(--body)}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(28px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;background:rgba(255,255,255,.12);border-radius:999px;padding:8px 14px}
h1{font-family:var(--display);font-weight:900;font-size:26px;margin:0}
.player{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:720/1264;max-height:78vh;margin:0 auto}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
video::cue{font-family:var(--body);font-size:18px;background:rgba(0,0,0,.55);color:#fff}
.note{margin:10px 2px 0;font-size:13px;color:#B5ACC7;text-align:center}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row select{flex:1 1 100%;font:600 16px var(--body);padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#1d1927;color:#fff}
.btn{flex:1;font:700 15px var(--body);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:11px 8px;cursor:pointer;background:rgba(255,255,255,.08);color:#fff;text-decoration:none;text-align:center}
.btn.on{background:var(--gold);color:#2B2233;border-color:var(--gold)}
.btn:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:92vw;background:rgba(255,255,255,.95);color:#1d1927;font:600 15px/1.4 var(--body);padding:12px 16px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><a class="back" href="more-videos.html">← More videos</a><h1>The Replay</h1></div>
  <div class="player">
    <video id="v" controls playsinline preload="metadata" poster="video/replay/poster.jpg"></video>
  </div>
  <p class="note" id="note"></p>
  <div class="row">
    <select id="lang" aria-label="Language"></select>
    <button class="btn" id="cc" type="button" aria-pressed="false">CC Subtitles</button>
    <a class="btn" id="dl" href="#" download>⬇ Download</a>
    <button class="btn" id="share" type="button">📤 Share</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var BASE = 'video/replay/', v = document.getElementById('v'), sel = document.getElementById('lang'),
    cc = document.getElementById('cc'), dl = document.getElementById('dl'), ccOn = false, list = [];
var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var toastT;
function toast(t) { var e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { e.classList.remove('on'); }, 4000); }
function applyCC() {
  for (var i = 0; i < v.textTracks.length; i++) v.textTracks[i].mode = ccOn ? 'showing' : 'hidden';
  cc.classList.toggle('on', ccOn); cc.setAttribute('aria-pressed', ccOn);
}
function load(code) {
  var L = list.filter(function (x) { return x.code === code; })[0] || list[0];
  var wasPlaying = !v.paused;
  while (v.firstChild) v.removeChild(v.firstChild);
  v.src = BASE + L.file;
  if (L.cc) {
    var t = document.createElement('track');
    t.kind = 'subtitles'; t.srclang = L.code; t.label = L.name; t.src = BASE + L.cc;
    t.addEventListener('load', applyCC); v.appendChild(t);
  }
  dl.href = BASE + L.file; dl.setAttribute('download', 'The-Replay-' + L.code + '.mp4');
  document.documentElement.lang = L.code;
  try { localStorage.setItem('replayLang', L.code); } catch (e) {}
  v.load(); applyCC();
  if (wasPlaying) v.play().catch(function () {});
}
cc.onclick = function () { ccOn = !ccOn; applyCC(); };
v.textTracks.addEventListener && v.textTracks.addEventListener('addtrack', applyCC);
dl.onclick = function (e) {
  if (iOS) { e.preventDefault(); window.open(dl.href, '_blank'); toast('Tap Share, then Save Video.'); }
};
document.getElementById('share').onclick = function () {
  var url = location.href.split('#')[0];
  if (navigator.share) { navigator.share({ title: 'The Replay', url: url }).catch(function () {}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast('Link copied.'); }, function () { prompt('Copy this link:', url); });
};
sel.onchange = function () { load(sel.value); };
fetch(BASE + 'videos.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
  list = d.langs; document.getElementById('note').textContent = d.note || '';
  list.forEach(function (L) { var o = document.createElement('option'); o.value = L.code; o.textContent = L.name; sel.appendChild(o); });
  var want = new URLSearchParams(location.search).get('lang'), saved = null;
  try { saved = localStorage.getItem('replayLang'); } catch (e) {}
  var nav = (navigator.language || 'en').slice(0, 2);
  var pick = [want, saved, nav, 'en'].filter(function (c) { return c && list.some(function (x) { return x.code === c; }); })[0] || list[0].code;
  sel.value = pick; if (list.length < 2) sel.style.display = 'none';
  load(pick);
});
</script>
</body>
</html>
