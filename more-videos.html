<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Way Back Home · More Videos</title>
<link rel="icon" href="art/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="art/apple-touch-icon.png">
<meta name="theme-color" content="#2F7FD9">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--sky:#2F7FD9;--gold:#FFD166;--paper:#FFFDF8;--ink:#2B2233;--soft:#6B6275;--line:rgba(43,34,51,.12);--card:#fff;
  --display:'Grandstander','Trebuchet MS',system-ui,sans-serif;--body:'Andika','Verdana',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1F1A2B;--ink:#F4EEFF;--soft:#B5ACC7;--line:rgba(255,255,255,.14);--card:#2A2438}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--paper)}
header{background:linear-gradient(160deg,#2F7FD9,#1d5fae);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 34px}
.top{max-width:720px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:6px;color:#fff;text-decoration:none;font-weight:700;font-size:15px;background:rgba(255,255,255,.18);border-radius:999px;padding:8px 14px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1;margin:18px 0 8px}
.lead{margin:0;font-size:17px;line-height:1.5;opacity:.95;max-width:560px}
main{max-width:720px;margin:-18px auto 0;background:var(--paper);border-radius:24px 24px 0 0;position:relative;padding:22px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.list{display:grid;gap:12px;margin:4px 0 8px}
.item{display:flex;gap:14px;align-items:center;color:inherit;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.item img{width:96px;height:170px;object-fit:cover;border-radius:12px;flex:none;background:#000}
.txt{flex:1;min-width:0}
.txt b{display:block;font-family:var(--display);font-size:22px;line-height:1.15}
.age{display:inline-block;font-size:13px;font-weight:700;color:#2B2233;background:var(--gold);border-radius:99px;padding:2px 10px;margin:6px 0 6px}
.txt p{margin:0;font-size:14.5px;line-height:1.45;color:var(--soft)}
.go{display:inline-block;margin-top:10px;font-weight:700;font-size:15px;color:#fff;background:var(--sky);border-radius:999px;padding:8px 16px}
.item:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<header><div class="top">
  <a class="back" href="./">← Back to the book</a>
  <h1>More Videos</h1>
  <p class="lead">Short films that tell the good news, in many languages.</p>
</div></header>
<main>
  <div class="list">
    <a class="item" href="replay.html">
      <img src="video/replay/poster.jpg" alt="" loading="lazy">
      <span class="txt">
        <b>The Replay</b>
        <span class="age">Ages 10–16 · 6 min</span>
        <p>Jace gets a few seconds to see his whole life replayed before God, and one chance to change how his story ends.</p>
        <span class="go">▶ Watch</span>
      </span>
    </a>
  </div>
</main>
</body>
</html>
